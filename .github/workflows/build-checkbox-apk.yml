name: Build Checkbox Ticker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'checkbox-ticker/**'
      - '.github/workflows/build-checkbox-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkbox-ticker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CheckboxTicker-apk
          path: checkbox-ticker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
