name: Build Balloon Tapper Test Simulator

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        shell: bash
        run: |
          set -e

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BalloonTapper"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          mkdir -p app/src/main/java/com/example/balloontapper
          mkdir -p app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.balloontapper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.balloontapper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Balloon Tapper Simulator"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Balloon Tapper Simulator</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/balloontapper/MainActivity.kt <<'EOF'
          package com.example.balloontapper

          import android.app.Activity
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PointF
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.random.Random

          class MainActivity : Activity() {

              private lateinit var simulator: SimulatorView

              private lateinit var minDelay: EditText
              private lateinit var maxDelay: EditText
              private lateinit var jitter: EditText
              private lateinit var pauseChance: EditText
              private lateinit var minPause: EditText
              private lateinit var maxPause: EditText
              private lateinit var minHold: EditText
              private lateinit var maxHold: EditText

              private lateinit var status: TextView

              private val prefs by lazy {
                  getSharedPreferences("simulator", MODE_PRIVATE)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val density = resources.displayMetrics.density
                  val pad = (16 * density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  val scroll = ScrollView(this)

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  fun title(text: String): TextView {
                      return TextView(this).apply {
                          this.text = text
                          textSize = 20f
                          setTextColor(Color.BLACK)
                          setPadding(0, pad / 2, 0, pad / 2)
                      }
                  }

                  fun label(text: String): TextView {
                      return TextView(this).apply {
                          this.text = text
                          textSize = 14f
                          setPadding(0, pad / 2, 0, 4)
                      }
                  }

                  fun input(
                      labelText: String,
                      key: String,
                      default: Int
                  ): EditText {

                      content.addView(label(labelText))

                      return EditText(this).apply {
                          inputType =
                              android.text.InputType.TYPE_CLASS_NUMBER or
                              android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL

                          setText(
                              prefs.getInt(key, default).toString()
                          )

                          content.addView(this)
                      }
                  }

                  content.addView(title("Balloon Tapper Test Simulator"))

                  content.addView(
                      TextView(this).apply {
                          text =
                              "This screen simulates input timing locally. " +
                              "It does not send randomized input to another app."
                          textSize = 14f
                          setPadding(0, 0, 0, pad)
                      }
                  )

                  val naturalMode = CheckBox(this).apply {
                      text = "Human-like timing mode"
                      isChecked = prefs.getBoolean("natural", true)
                  }

                  content.addView(naturalMode)

                  minDelay = input(
                      "Minimum delay between simulated taps (ms)",
                      "minDelay",
                      60
                  )

                  maxDelay = input(
                      "Maximum delay between simulated taps (ms)",
                      "maxDelay",
                      140
                  )

                  jitter = input(
                      "Position jitter radius (px)",
                      "jitter",
                      8
                  )

                  pauseChance = input(
                      "Occasional pause probability (%)",
                      "pauseChance",
                      8
                  )

                  minPause = input(
                      "Minimum occasional pause (ms)",
                      "minPause",
                      300
                  )

                  maxPause = input(
                      "Maximum occasional pause (ms)",
                      "maxPause",
                      900
                  )

                  minHold = input(
                      "Minimum simulated hold duration (ms)",
                      "minHold",
                      35
                  )

                  maxHold = input(
                      "Maximum simulated hold duration (ms)",
                      "maxHold",
                      80
                  )

                  status = TextView(this).apply {
                      textSize = 15f
                      setPadding(0, pad, 0, pad)
                  }

                  content.addView(status)

                  val save = Button(this).apply {
                      text = "Save settings"
                      setOnClickListener {
                          saveSettings(naturalMode.isChecked)
                      }
                  }

                  content.addView(save)

                  val start = Button(this).apply {
                      text = "Start local simulation"
                      setOnClickListener {
                          saveSettings(naturalMode.isChecked)
                          simulator.startSimulation()
                      }
                  }

                  content.addView(start)

                  val stop = Button(this).apply {
                      text = "Stop simulation"
                      setOnClickListener {
                          simulator.stopSimulation()
                      }
                  }

                  content.addView(stop)

                  simulator = SimulatorView()

                  content.addView(
                      simulator,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (360 * density).toInt()
                      )
                  )

                  scroll.addView(content)
                  root.addView(scroll)

                  setContentView(root)

                  updateStatus()
              }

              private fun number(
                  field: EditText,
                  fallback: Int
              ): Int {
                  return field.text
                      .toString()
                      .toIntOrNull()
                      ?: fallback
              }

              private fun saveSettings(natural: Boolean) {

                  var min = number(minDelay, 60)
                  var max = number(maxDelay, 140)

                  min = min.coerceIn(5, 5000)
                  max = max.coerceIn(min, 5000)

                  val jitterValue =
                      number(jitter, 8).coerceIn(0, 100)

                  val chance =
                      number(pauseChance, 8).coerceIn(0, 100)

                  val pMin =
                      number(minPause, 300).coerceIn(50, 10000)

                  val pMax =
                      number(maxPause, 900).coerceIn(pMin, 15000)

                  val hMin =
                      number(minHold, 35).coerceIn(5, 1000)

                  val hMax =
                      number(maxHold, 80).coerceIn(hMin, 2000)

                  prefs.edit()
                      .putBoolean("natural", natural)
                      .putInt("minDelay", min)
                      .putInt("maxDelay", max)
                      .putInt("jitter", jitterValue)
                      .putInt("pauseChance", chance)
                      .putInt("minPause", pMin)
                      .putInt("maxPause", pMax)
                      .putInt("minHold", hMin)
                      .putInt("maxHold", hMax)
                      .apply()

                  updateStatus()
              }

              private fun updateStatus() {

                  val min =
                      prefs.getInt("minDelay", 60)

                  val max =
                      prefs.getInt("maxDelay", 140)

                  val j =
                      prefs.getInt("jitter", 8)

                  status.text =
                      "Timing: $min–$max ms\n" +
                      "Position variation: ±$j px\n" +
                      "Simulation ready"
              }

              inner class SimulatorView :
                  View(this@MainActivity) {

                  private val paint =
                      Paint(Paint.ANTI_ALIAS_FLAG)

                  private val handler =
                      Handler(Looper.getMainLooper())

                  private val taps =
                      ArrayList<TapPoint>()

                  private var running = false

                  private var tapCount = 0

                  private val balloonPaint =
                      Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.rgb(80, 130, 255)
                          style = Paint.Style.FILL
                      }

                  private val tapPaint =
                      Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.RED
                          style = Paint.Style.STROKE
                          strokeWidth = 5f
                      }

                  override fun onDraw(canvas: Canvas) {

                      super.onDraw(canvas)

                      canvas.drawColor(
                          Color.rgb(245, 245, 245)
                      )

                      val cx = width / 2f
                      val cy = height / 2f

                      paint.color = Color.DKGRAY
                      paint.textSize = 22f

                      canvas.drawText(
                          "LOCAL TEST AREA",
                          20f,
                          35f,
                          paint
                      )

                      balloonPaint.color =
                          Color.rgb(90, 145, 255)

                      canvas.drawCircle(
                          cx,
                          cy,
                          55f,
                          balloonPaint
                      )

                      paint.color = Color.WHITE
                      paint.textSize = 18f

                      canvas.drawText(
                          "TEST",
                          cx - 24f,
                          cy + 6f,
                          paint
                      )

                      synchronized(taps) {

                          for (tap in taps) {

                              tapPaint.alpha =
                                  tap.alpha

                              canvas.drawCircle(
                                  tap.x,
                                  tap.y,
                                  18f,
                                  tapPaint
                              )
                          }
                      }

                      paint.color = Color.DKGRAY
                      paint.textSize = 18f

                      canvas.drawText(
                          "Simulated taps: $tapCount",
                          20f,
                          height - 25f,
                          paint
                      )
                  }

                  fun startSimulation() {

                      if (running) return

                      running = true
                      tapCount = 0
                      taps.clear()

                      scheduleNext()
                  }

                  fun stopSimulation() {

                      running = false
                      handler.removeCallbacksAndMessages(null)

                      invalidate()
                  }

                  private fun scheduleNext() {

                      if (!running) return

                      val min =
                          prefs.getInt("minDelay", 60)

                      val max =
                          prefs.getInt("maxDelay", 140)

                      val chance =
                          prefs.getInt("pauseChance", 8)

                      val minPauseValue =
                          prefs.getInt("minPause", 300)

                      val maxPauseValue =
                          prefs.getInt("maxPause", 900)

                      var delay =
                          Random.nextLong(
                              min.toLong(),
                              max.toLong() + 1
                          )

                      if (
                          Random.nextInt(100) < chance
                      ) {

                          delay += Random.nextLong(
                              minPauseValue.toLong(),
                              maxPauseValue.toLong() + 1
                          )
                      }

                      handler.postDelayed(
                          {

                              if (!running) return@postDelayed

                              createSimulatedTap()

                              scheduleNext()
                          },
                          delay
                      )
                  }

                  private fun createSimulatedTap() {

                      val radius =
                          prefs.getInt("jitter", 8)

                      val angle =
                          Random.nextDouble(
                              0.0,
                              Math.PI * 2
                          )

                      val distance =
                          Random.nextDouble(
                              0.0,
                              radius.toDouble()
                          )

                      val cx = width / 2f
                      val cy = height / 2f

                      val x =
                          cx +
                          cos(angle).toFloat() *
                          distance

                      val y =
                          cy +
                          sin(angle).toFloat() *
                          distance

                      synchronized(taps) {

                          taps.add(
                              TapPoint(
                                  x,
                                  y,
                                  255
                              )
                          )

                          if (taps.size > 40) {
                              taps.removeAt(0)
                          }
                      }

                      tapCount++

                      animateTap(x, y)

                      invalidate()
                  }

                  private fun animateTap(
                      x: Float,
                      y: Float
                  ) {

                      val point =
                          TapPoint(x, y, 255)

                      synchronized(taps) {
                          taps.add(point)
                      }

                      val fade =
                          object : Runnable {

                              override fun run() {

                                  point.alpha -= 25

                                  if (point.alpha <= 0) {

                                      synchronized(taps) {
                                          taps.remove(point)
                                      }

                                      invalidate()
                                      return
                                  }

                                  invalidate()

                                  handler.postDelayed(
                                      this,
                                      30
                                  )
                              }
                          }

                      handler.post(fade)
                  }

                  override fun onTouchEvent(
                      event: MotionEvent
                  ): Boolean {

                      if (
                          event.action ==
                          MotionEvent.ACTION_DOWN
                      ) {

                          synchronized(taps) {

                              taps.add(
                                  TapPoint(
                                      event.x,
                                      event.y,
                                      255
                                  )
                              )
                          }

                          invalidate()

                          return true
                      }

                      return true
                  }
              }

              data class TapPoint(
                  val x: Float,
                  val y: Float,
                  var alpha: Int
              )
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalloonTapper-Test-Simulator
          path: app/build/outputs/apk/debug/app-debug.apk
