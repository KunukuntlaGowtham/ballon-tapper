name: Build Balloon Tapper APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BalloonTapper"
          include(":app")
          ENDOFFILE
          cat > build.gradle.kts <<'ENDOFFILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ENDOFFILE
          cat > gradle.properties <<'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          ENDOFFILE
          mkdir -p app
          cat > app/build.gradle.kts <<'ENDOFFILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.balloontapper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.balloontapper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          ENDOFFILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Balloon Tapper"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ENDOFFILE'
          <resources>
              <string name="acc_desc">Lets Balloon Tapper tap on screen where your chosen colours appear.</string>
          </resources>
          ENDOFFILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/tap_service.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/acc_desc"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true" />
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/TapService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.PointF
          import android.view.accessibility.AccessibilityEvent

          /** Performs the actual taps. Must be enabled in Settings > Accessibility. */
          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              /** Taps every point quickly, in batches the system allows, then calls done(). */
              fun tapMany(points: List<PointF>, gapMs: Long, done: () -> Unit) {
                  val batch = GestureDescription.getMaxStrokeCount().coerceAtLeast(1)
                  val chunks = points.chunked(batch)
                  fun send(i: Int) {
                      if (i >= chunks.size) { done(); return }
                      val builder = GestureDescription.Builder()
                      chunks[i].forEachIndexed { k, pt ->
                          val path = Path().apply { moveTo(pt.x, pt.y) }
                          builder.addStroke(GestureDescription.StrokeDescription(path, k * gapMs, 10L))
                      }
                      val ok = dispatchGesture(builder.build(), object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) = send(i + 1)
                          override fun onCancelled(g: GestureDescription?) = send(i + 1)
                      }, null)
                      if (!ok) done()
                  }
                  if (chunks.isEmpty()) done() else send(0)
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/CaptureService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Point
          import android.graphics.PointF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs
          import kotlin.math.hypot

          /** Captures the whole screen, finds pixels matching the target colours, and sends taps. */
          class CaptureService : Service() {

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private lateinit var thread: HandlerThread
              private lateinit var handler: Handler
              private lateinit var wm: WindowManager

              private var overlay: TextView? = null
              private var overlayParams: WindowManager.LayoutParams? = null

              @Volatile private var running = false
              @Volatile private var busy = false

              private var screenW = 0
              private var screenH = 0
              private val scale = 4               // scan a 1/4-size copy of the screen for speed

              // settings (from MainActivity)
              private var rules: Array<FloatArray> = emptyArray()
              private var maxTaps = 15
              private var skipTopPct = 8
              private val tapGapMs = 15L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (projection != null || intent == null) return START_NOT_STICKY
                  startAsForeground()

                  val code = intent.getIntExtra("code", 0)
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33)
                      intent.getParcelableExtra("data", Intent::class.java)
                  else @Suppress("DEPRECATION") intent.getParcelableExtra("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  loadSettings()
                  thread = HandlerThread("scanner").apply { start() }
                  handler = Handler(thread.looper)
                  wm = getSystemService(WindowManager::class.java)

                  startCapture(code, data)
                  showOverlay()
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("tapper", "Balloon Tapper", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "tapper")
                      .setContentTitle("Balloon Tapper is watching the screen")
                      .setContentText("Long-press the floating button to quit")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)
              }

              private fun loadSettings() {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  // hueMin, hueMax, satMin, satMax, valMin  (tuned on Google Store Playground screenshots)
                  val all = mapOf(
                      "blue" to listOf(floatArrayOf(203f, 222f, 0.45f, 1.00f, 0.55f)),
                      "red" to listOf(floatArrayOf(0f, 14f, 0.60f, 1.00f, 0.75f), floatArrayOf(355f, 360f, 0.60f, 1.00f, 0.75f)),
                      "yellow" to listOf(floatArrayOf(44f, 64f, 0.30f, 1.00f, 0.65f)),
                      "green" to listOf(floatArrayOf(128f, 154f, 0.35f, 0.74f, 0.62f))
                  )
                  rules = all.filterKeys { p.getBoolean(it, true) }.values.flatten().toTypedArray()
                  maxTaps = p.getInt("maxTaps", 15)
                  skipTopPct = p.getInt("skipTop", 8)
              }

              private fun startCapture(code: Int, data: Intent) {
                  val size = Point()
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.maximumWindowMetrics.bounds
                      size.set(b.width(), b.height())
                  } else @Suppress("DEPRECATION") wm.defaultDisplay.getRealSize(size)
                  screenW = size.x
                  screenH = size.y

                  val w = screenW / scale
                  val h = screenH / scale
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)

                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "tapper", w, h, resources.displayMetrics.densityDpi / scale,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler
                  )
                  handler.post(loop)
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (projection == null) return
                      if (running && !busy) scanAndTap() else reader?.acquireLatestImage()?.close()
                      handler.postDelayed(this, 25)
                  }
              }

              private fun colourMatch(r: Int, g: Int, b: Int): Boolean {
                  val mx = maxOf(r, maxOf(g, b)); val mn = minOf(r, minOf(g, b)); val d = mx - mn
                  if (d == 0 || mx == 0) return false
                  val v = mx / 255f
                  val s = d.toFloat() / mx
                  var h = when (mx) {
                      r -> 60f * (g - b) / d
                      g -> 60f * (b - r) / d + 120f
                      else -> 60f * (r - g) / d + 240f
                  }
                  if (h < 0) h += 360f
                  for (rule in rules) {
                      if (h >= rule[0] && h <= rule[1] && s >= rule[2] && s <= rule[3] && v >= rule[4]) return true
                  }
                  return false
              }

              private fun scanAndTap() {
                  val img = reader?.acquireLatestImage() ?: return
                  val hits = ArrayList<PointF>()
                  try {
                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val px = plane.pixelStride
                      val w = img.width
                      val h = img.height
                      val sx = screenW.toFloat() / w
                      val sy = screenH.toFloat() / h

                      // 1. mark every pixel that looks like a balloon colour
                      val top = h * skipTopPct / 100
                      val mask = BooleanArray(w * h)
                      for (y in top until h) for (x in 0 until w) {
                          val i = y * rowStride + x * px
                          mask[y * w + x] = colourMatch(
                              buf.get(i).toInt() and 0xff, buf.get(i + 1).toInt() and 0xff, buf.get(i + 2).toInt() and 0xff
                          )
                      }

                      // 2. group touching pixels into blobs and keep the round, balloon-sized ones
                      val seen = BooleanArray(w * h)
                      val stack = IntArray(w * h)
                      val blobs = ArrayList<FloatArray>()   // cx, cy, size
                      for (start in 0 until w * h) {
                          if (!mask[start] || seen[start]) continue
                          var sp = 0; stack[sp++] = start; seen[start] = true
                          var n = 0; var sumX = 0L; var sumY = 0L
                          var minX = w; var maxX = 0; var minY = h; var maxY = 0
                          val members = ArrayList<Int>()
                          while (sp > 0) {
                              val idx = stack[--sp]; val x = idx % w; val y = idx / w
                              n++; sumX += x; sumY += y; members.add(idx)
                              if (x < minX) minX = x; if (x > maxX) maxX = x
                              if (y < minY) minY = y; if (y > maxY) maxY = y
                              if (x + 1 < w && mask[idx + 1] && !seen[idx + 1]) { seen[idx + 1] = true; stack[sp++] = idx + 1 }
                              if (x > 0 && mask[idx - 1] && !seen[idx - 1]) { seen[idx - 1] = true; stack[sp++] = idx - 1 }
                              if (y + 1 < h && mask[idx + w] && !seen[idx + w]) { seen[idx + w] = true; stack[sp++] = idx + w }
                              if (y > 0 && mask[idx - w] && !seen[idx - w]) { seen[idx - w] = true; stack[sp++] = idx - w }
                          }
                          if (n < 20 || minY <= top) continue            // tiny speck, or background under the top bar
                          val bw = maxX - minX + 1; val bh = maxY - minY + 1
                          val fill = n.toFloat() / (bw * bh)
                          val aspect = bw.toFloat() / bh
                          val big = maxOf(bw, bh)
                          if (big <= 75 && aspect in 0.6f..1.66f && fill >= 0.5f) {
                              blobs.add(floatArrayOf(sumX.toFloat() / n, sumY.toFloat() / n, n.toFloat()))
                          } else if (big <= 150 && fill >= 0.35f && (aspect > 1.66f || aspect < 0.6f)) {
                              // two balloons touching: split down the long side and tap both halves
                              val horizontal = aspect > 1f
                              val mid = if (horizontal) (minX + maxX) / 2f else (minY + maxY) / 2f
                              var ax = 0L; var ay = 0L; var an = 0; var bx = 0L; var by = 0L; var bn = 0
                              for (idx in members) {
                                  val x = idx % w; val y = idx / w
                                  if ((if (horizontal) x.toFloat() else y.toFloat()) < mid) { ax += x; ay += y; an++ }
                                  else { bx += x; by += y; bn++ }
                              }
                              if (an > 0) blobs.add(floatArrayOf(ax.toFloat() / an, ay.toFloat() / an, an.toFloat()))
                              if (bn > 0) blobs.add(floatArrayOf(bx.toFloat() / bn, by.toFloat() / bn, bn.toFloat()))
                          }
                      }

                      // 3. biggest balloons first (easiest points), then tap
                      blobs.sortByDescending { it[2] }
                      for (bl in blobs) {
                          if (hits.size >= maxTaps) break
                          val rx = (bl[0] + 0.5f) * sx
                          val ry = (bl[1] + 0.5f) * sy
                          if (!onOverlay(rx, ry)) hits.add(PointF(rx, ry))
                      }
                  } finally {
                      img.close()
                  }

                  val tapper = TapService.instance
                  if (tapper == null) {
                      running = false
                      Handler(Looper.getMainLooper()).post {
                          overlay?.text = "START"
                          Toast.makeText(this, "Turn on Balloon Tapper in Accessibility settings", Toast.LENGTH_LONG).show()
                      }
                      return
                  }
                  if (hits.isNotEmpty()) {
                      busy = true
                      start() }
                  handler = Handler(thread.looper)
                  wm = getSystemService(WindowManager::class.java)

                  startCapture(code, data)
                  showOverlay()
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("tapper", "Balloon Tapper", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "tapper")
                      .setContentTitle("Balloon Tapper is watching the screen")
                      .setContentText("Long-press the floating button to quit")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)
              }

              private fun loadSettings() {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  // hueMin, hueMax, satMin, satMax, valMin  (tuned on Google Store Playground screenshots)
                  val all = mapOf(
                      "blue" to floatArrayOf(205f, 219f, 0.60f, 1.00f, 0.60f),
                      "red" to floatArrayOf(1f, 12f, 0.78f, 1.00f, 0.80f),
                      "yellow" to floatArrayOf(46f, 62f, 0.40f, 1.00f, 0.70f),
                      "green" to floatArrayOf(132f, 150f, 0.45f, 0.72f, 0.67f)
                  )
                  rules = all.filterKeys { p.getBoolean(it, true) }.values.toTypedArray()
                  maxTaps = p.getInt("maxTaps", 10)
                  skipTopPct = p.getInt("skipTop", 8)
              }

              private fun startCapture(code: Int, data: Intent) {
                  val size = Point()
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.maximumWindowMetrics.bounds
                      size.set(b.width(), b.height())
                  } else @Suppress("DEPRECATION") wm.defaultDisplay.getRealSize(size)
                  screenW = size.x
                  screenH = size.y

                  val w = screenW / scale
                  val h = screenH / scale
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)

                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "tapper", w, h, resources.displayMetrics.densityDpi / scale,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler
                  )
                  handler.post(loop)
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (projection == null) return
                      if (running && !busy) scanAndTap() else reader?.acquireLatestImage()?.close()
                      handler.postDelayed(this, 50)
                  }
              }

              private fun colourMatch(r: Int, g: Int, b: Int): Boolean {
                  val mx = maxOf(r, maxOf(g, b)); val mn = minOf(r, minOf(g, b)); val d = mx - mn
                  if (d == 0 || mx == 0) return false
                  val v = mx / 255f
                  val s = d.toFloat() / mx
                  var h = when (mx) {
                      r -> 60f * (g - b) / d
                      g -> 60f * (b - r) / d + 120f
                      else -> 60f * (r - g) / d + 240f
                  }
                  if (h < 0) h += 360f
                  for (rule in rules) {
                      if (h >= rule[0] && h <= rule[1] && s >= rule[2] && s <= rule[3] && v >= rule[4]) return true
                  }
                  return false
              }

              private fun scanAndTap() {
                  val img = reader?.acquireLatestImage() ?: return
                  val hits = ArrayList<PointF>()
                  try {
                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val px = plane.pixelStride
                      val w = img.width
                      val h = img.height
                      val sx = screenW.toFloat() / w
                      val sy = screenH.toFloat() / h

                      // 1. mark every pixel that looks like a balloon colour
                      val mask = BooleanArray(w * h)
                      for (y in 0 until h) for (x in 0 until w) {
                          val i = y * rowStride + x * px
                          mask[y * w + x] = colourMatch(
                              buf.get(i).toInt() and 0xff, buf.get(i + 1).toInt() and 0xff, buf.get(i + 2).toInt() and 0xff
                          )
                      }
                      fun m(x: Int, y: Int) = x in 0 until w && y in 0 until h && mask[y * w + x]

                      // 2. find round blobs (balloons), skip big coloured areas (background)
                      val box = 30                         // ~120 real px
                      val minGap = box * 0.8f
                      val found = ArrayList<IntArray>()
                      var y = h * skipTopPct / 100
                      while (y < h && found.size < maxTaps) {
                          var x = 0
                          while (x < w && found.size < maxTaps) {
                              if (mask[y * w + x] && found.none { hypot((it[0] - x).toFloat(), (it[1] - y).toFloat()) < minGap }) {
                                  var sumX = 0; var sumY = 0; var n = 0
                                  for (yy in maxOf(0, y - 4) until minOf(h, y + 2 * box))
                                      for (xx in maxOf(0, x - box) until minOf(w, x + box))
                                          if (mask[yy * w + xx]) { sumX += xx; sumY += yy; n++ }
                                  if (n >= 15) {
                                      val cx = sumX / n; val cy = sumY / n
                                      var edge = 0; var edgeN = 0
                                      for (d in -box..box) {
                                          if (m(cx + d, cy - box)) edge++
                                          if (m(cx + d, cy + box)) edge++
                                          if (m(cx - box, cy + d)) edge++
                                          if (m(cx + box, cy + d)) edge++
                                          edgeN += 4
                                      }
                                      val isBackground = edge.toFloat() / edgeN > 0.25f
                                      if (!isBackground && found.none { hypot((it[0] - cx).toFloat(), (it[1] - cy).toFloat()) < minGap }) {
                                          val rx = (cx + 0.5f) * sx
                                          val ry = (cy + 0.5f) * sy
                                          if (!onOverlay(rx, ry)) { found.add(intArrayOf(cx, cy)); hits.add(PointF(rx, ry)) }
                                      }
                                  }
                              }
                              x += 2
                          }
                          y += 2
                      }
                  } finally {
                      img.close()
                  }

                  val tapper = TapService.instance
                  if (tapper == null) {
                      running = false
                      Handler(Looper.getMainLooper()).post {
                          overlay?.text = "START"
                          Toast.makeText(this, "Turn on Balloon Tapper in Accessibility settings", Toast.LENGTH_LONG).show()
                      }
                      return
                  }
                  if (hits.isNotEmpty()) {
                      busy = true
                      tapper.tapMany(hits, tapGapMs) { busy = false }
                  }
              }

              private fun onOverlay(x: Float, y: Float): Boolean {
                  val p = overlayParams ?: return false
                  val v = overlay ?: return false
                  val pad = 40
                  return x >= p.x - pad && x <= p.x + v.width + pad && y >= p.y - pad && y <= p.y + v.height + pad
              }

              @SuppressLint("ClickableViewAccessibility", "SetTextI18n")
              private fun showOverlay() {
                  val tv = TextView(this).apply {
                      text = "START"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(200, 30, 30, 30))
                      setPadding(36, 24, 36, 24)
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 30; y = 300 }

                  var downX = 0f; var downY = 0f; var startX = 0; var startY = 0
                  var downTime = 0L; var moved = false
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY; startX = params.x; startY = params.y
                              downTime = SystemClock.uptimeMillis(); moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX; val dy = e.rawY - downY
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              if (moved) {
                                  params.x = startX + dx.toInt(); params.y = startY + dy.toInt()
                                  wm.updateViewLayout(tv, params)
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) {
                              if (SystemClock.uptimeMillis() - downTime > 800) {
                                  stopSelf()      // long-press = quit
                              } else {
                                  running = !running
                                  tv.text = if (running) "STOP" else "START"
                              }
                          }
                      }
                      true
                  }
                  wm.addView(tv, params)
                  overlay = tv
                  overlayParams = params
              }

              override fun onDestroy() {
                  running = false
                  overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  virtualDisplay?.release()
                  reader?.close()
                  projection?.stop()
                  projection = null
                  if (::thread.isInitialized) thread.quitSafely()
                  super.onDestroy()
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/MainActivity.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private var checks: List<CheckBox> = emptyList()
              private lateinit var maxTaps: EditText
              private lateinit var skipTop: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun label(t: String) = TextView(this).apply { text = t; setPadding(0, pad, 0, 0) }
                  fun button(t: String, onClick: (View) -> Unit) =
                      Button(this).apply { text = t; setOnClickListener(onClick) }

                  status = TextView(this).apply { textSize = 15f }
                  root.addView(status)

                  root.addView(label("Balloon colours to pop (grey balloons are always skipped)"))
                  val colourNames = listOf("blue" to "Blue", "red" to "Red", "yellow" to "Yellow", "green" to "Green")
                  checks = colourNames.map { (key, name) ->
                      CheckBox(this).apply { text = name; isChecked = prefs.getBoolean(key, true); tag = key }.also { root.addView(it) }
                  }

                  root.addView(label("Max taps per scan"))
                  maxTaps = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("maxTaps", 10).toString()) }
                  root.addView(maxTaps)

                  root.addView(label("Ignore top % of screen (score bar etc.)"))
                  skipTop = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("skipTop", 8).toString()) }
                  root.addView(skipTop)

                  root.addView(button("1. Allow floating button") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("2. Turn on tap service (Accessibility)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  root.addView(button("3. Save & launch overlay") { launch() })

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onResume() {
                  super.onResume()
                  val overlayOk = Settings.canDrawOverlays(this)
                  val tapOk = TapService.instance != null
                  status.text = "Floating button permission: ${if (overlayOk) "OK" else "NO"}\n" +
                          "Tap service: ${if (tapOk) "OK" else "NO"}"
              }

              private fun launch() {
                  val ed = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                  checks.forEach { ed.putBoolean(it.tag as String, it.isChecked) }
                  ed.putInt("maxTaps", maxTaps.text.toString().toIntOrNull()?.coerceIn(1, 20) ?: 10)
                      .putInt("skipTop", skipTop.text.toString().toIntOrNull()?.coerceIn(0, 90) ?: 8)
                      .apply()

                  if (!Settings.canDrawOverlays(this)) { toast("Do step 1 first"); return }
                  if (TapService.instance == null) { toast("Do step 2 first"); return }
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 2)

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), 1)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 1) return
                  if (resultCode != RESULT_OK || data == null) { toast("Screen capture is needed to find balloons"); return }
                  startForegroundService(Intent(this, CaptureService::class.java)
                      .putExtra("code", resultCode).putExtra("data", data))
                  toast("Open your game and tap START")
                  moveTaskToBack(true)
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }
          ENDOFFILE
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonTapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
