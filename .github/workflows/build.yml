name: Build Balloon Tapper APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BalloonTapper"
          include(":app")
          ENDOFFILE
          cat > build.gradle.kts <<'ENDOFFILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ENDOFFILE
          cat > gradle.properties <<'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          ENDOFFILE
          mkdir -p app
          cat > app/build.gradle.kts <<'ENDOFFILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.balloontapper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.balloontapper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          ENDOFFILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="Balloon Tapper"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ENDOFFILE'
          <resources>
              <string name="acc_desc">Lets Balloon Tapper tap on screen where your chosen colours appear.</string>
          </resources>
          ENDOFFILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/tap_service.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/acc_desc"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true" />
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/TapService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.PointF
          import android.view.accessibility.AccessibilityEvent

          /** Performs the actual taps. Must be enabled in Settings > Accessibility. */
          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              /** Taps every point quickly, in batches the system allows, then calls done(). */
              fun tapMany(points: List<PointF>, gapMs: Long, done: () -> Unit) {
                  val batch = GestureDescription.getMaxStrokeCount().coerceAtLeast(1)
                  val chunks = points.chunked(batch)
                  fun send(i: Int) {
                      if (i >= chunks.size) { done(); return }
                      val ok = try {
                          val builder = GestureDescription.Builder()
                          chunks[i].forEachIndexed { k, pt ->
                              val path = Path().apply { moveTo(maxOf(0f, pt.x), maxOf(0f, pt.y)) }
                              builder.addStroke(GestureDescription.StrokeDescription(path, k * gapMs, 8L))
                          }
                          dispatchGesture(builder.build(), object : GestureResultCallback() {
                              override fun onCompleted(g: GestureDescription?) = send(i + 1)
                              override fun onCancelled(g: GestureDescription?) = send(i + 1)
                          }, null)
                      } catch (e: Exception) {
                          android.util.Log.e("BalloonTapper", "tap error", e)
                          false
                      }
                      if (!ok) done()
                  }
                  if (chunks.isEmpty()) done() else send(0)
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/CaptureService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Point
          import android.graphics.PointF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs
          import kotlin.math.hypot

          /** Captures the whole screen, finds pixels matching the target colours, and sends taps. */
          class CaptureService : Service() {

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private lateinit var thread: HandlerThread
              private lateinit var handler: Handler
              private lateinit var wm: WindowManager

              private var overlay: TextView? = null
              private var overlayParams: WindowManager.LayoutParams? = null

              @Volatile private var running = false
              @Volatile private var busy = false
              @Volatile private var nextScanAt = 0L

              // memory used to avoid double taps and to aim ahead of moving balloons
              private val recentTaps = ArrayList<FloatArray>()      // x, y, timeMs
              private var prevBlobs = ArrayList<FloatArray>()       // x, y (screen px)
              private var prevFrameAt = 0L
              private val startedAt = SystemClock.uptimeMillis()
              private val tapCooldownMs = 450f                      // don't re-tap the same spot for this long
              private val leadMs = 70f                              // how far ahead to aim

              private var screenW = 0
              private var screenH = 0
              private val scale = 4               // scan a 1/4-size copy of the screen for speed

              // settings (from MainActivity)
              private var enabledColours = booleanArrayOf(true, true, true, true)

              // special ringed balloons must be popped blue -> red -> yellow -> green
              private var nextSpecial = 0
              private var specialLastSeen = 0L
              private var pendingSpecial: FloatArray? = null   // x, y, colour, timeMs

              companion object {
                  // colour, hueMin, hueMax, satMin, satMax, valMin (tuned on Google Store Playground screenshots)
                  private val RULES = arrayOf(
                      floatArrayOf(0f, 203f, 222f, 0.45f, 1.00f, 0.55f),
                      floatArrayOf(1f, 0f, 14f, 0.60f, 1.00f, 0.75f),
                      floatArrayOf(1f, 355f, 360f, 0.60f, 1.00f, 0.75f),
                      floatArrayOf(2f, 44f, 64f, 0.30f, 1.00f, 0.65f),
                      floatArrayOf(3f, 128f, 154f, 0.35f, 0.74f, 0.62f)
                  )
                  private val RING_HUE = floatArrayOf(213f, 3f, 51f, 133f)
              }
              private var maxTaps = 15
              private var skipTopPct = 8
              private val tapGapMs = 12L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (projection != null || intent == null) return START_NOT_STICKY
                  startAsForeground()

                  val code = intent.getIntExtra("code", 0)
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33)
                      intent.getParcelableExtra("data", Intent::class.java)
                  else @Suppress("DEPRECATION") intent.getParcelableExtra("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  loadSettings()
                  thread = HandlerThread("scanner").apply { start() }
                  handler = Handler(thread.looper)
                  wm = getSystemService(WindowManager::class.java)

                  startCapture(code, data)
                  showOverlay()
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("tapper", "Balloon Tapper", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "tapper")
                      .setContentTitle("Balloon Tapper is watching the screen")
                      .setContentText("Long-press the floating button to quit")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)
              }

              private fun loadSettings() {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  enabledColours = booleanArrayOf(
                      p.getBoolean("blue", true), p.getBoolean("red", true), p.getBoolean("yellow", true), p.getBoolean("green", true)
                  )
                  maxTaps = p.getInt("maxTaps", 15)
                  skipTopPct = p.getInt("skipTop", 8)
              }

              private fun startCapture(code: Int, data: Intent) {
                  val size = Point()
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.maximumWindowMetrics.bounds
                      size.set(b.width(), b.height())
                  } else @Suppress("DEPRECATION") wm.defaultDisplay.getRealSize(size)
                  screenW = size.x
                  screenH = size.y

                  val w = screenW / scale
                  val h = screenH / scale
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)

                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "tapper", w, h, resources.displayMetrics.densityDpi / scale,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler
                  )
                  handler.post(loop)
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (projection == null) return
                      try {
                          if (running && !busy && SystemClock.uptimeMillis() >= nextScanAt) scanAndTap() else reader?.acquireLatestImage()?.close()
                      } catch (e: Exception) {
                          busy = false
                          android.util.Log.e("BalloonTapper", "scan error", e)
                      }
                      handler.postDelayed(this, 25)
                  }
              }

              private fun colourMatch(r: Int, g: Int, b: Int, hs: FloatArray): Int {
                  val mx = maxOf(r, maxOf(g, b)); val mn = minOf(r, minOf(g, b)); val d = mx - mn
                  if (mx == 0) { hs[0] = 0f; hs[1] = 0f; return -1 }
                  val s = d.toFloat() / mx
                  var h = if (d == 0) 0f else when (mx) {
                      r -> 60f * (g - b) / d
                      g -> 60f * (b - r) / d + 120f
                      else -> 60f * (r - g) / d + 240f
                  }
                  if (h < 0) h += 360f
                  hs[0] = h; hs[1] = s
                  if (d == 0) return -1
                  val v = mx / 255f
                  for (rule in RULES) {
                      if (h >= rule[1] && h <= rule[2] && s >= rule[3] && s <= rule[4] && v >= rule[5]) return rule[0].toInt()
                  }
                  return -1
              }

              private fun hueDiff(a: Float, b: Float): Float {
                  val d = abs(a - b) % 360f
                  return minOf(d, 360f - d)
              }

              private fun scanAndTap() {
                  val img = reader?.acquireLatestImage() ?: return
                  val hits = ArrayList<PointF>()
                  val now = SystemClock.uptimeMillis()
                  val nowRel = (now - startedAt).toFloat()
                  try {
                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val px = plane.pixelStride
                      val w = img.width
                      val h = img.height
                      val sx = screenW.toFloat() / w
                      val sy = screenH.toFloat() / h

                      // 1. label each pixel with a balloon colour (0 blue, 1 red, 2 yellow, 3 green, -1 none)
                      val top = h * skipTopPct / 100
                      val label = ByteArray(w * h) { -1 }
                      val hue = FloatArray(w * h)
                      val sat = FloatArray(w * h)
                      val hs = FloatArray(2)
                      for (y in 0 until h) for (x in 0 until w) {
                          val i = y * rowStride + x * px
                          val c = colourMatch(buf.get(i).toInt() and 0xff, buf.get(i + 1).toInt() and 0xff, buf.get(i + 2).toInt() and 0xff, hs)
                          val k = y * w + x
                          hue[k] = hs[0]; sat[k] = hs[1]
                          if (y >= top) label[k] = c.toByte()
                      }

                      // 2. group same-colour pixels into blobs, keep round balloon-sized ones
                      val seen = BooleanArray(w * h)
                      val stack = IntArray(w * h)
                      val normal = ArrayList<FloatArray>()    // cx, cy, size, colour  (scaled px)
                      val specials = ArrayList<FloatArray>()  // cx, cy, size, colour
                      for (start in 0 until w * h) {
                          val c = label[start].toInt()
                          if (c < 0 || seen[start]) continue
                          var sp = 0; stack[sp++] = start; seen[start] = true
                          var n = 0; var sumX = 0L; var sumY = 0L
                          var minX = w; var maxX = 0; var minY = h; var maxY = 0
                          val members = ArrayList<Int>()
                          while (sp > 0) {
                              val idx = stack[--sp]; val x = idx % w; val y = idx / w
                              n++; sumX += x; sumY += y; members.add(idx)
                              if (x < minX) minX = x
                              if (x > maxX) maxX = x
                              if (y < minY) minY = y
                              if (y > maxY) maxY = y
                              if (x + 1 < w && label[idx + 1].toInt() == c && !seen[idx + 1]) { seen[idx + 1] = true; stack[sp++] = idx + 1 }
                              if (x > 0 && label[idx - 1].toInt() == c && !seen[idx - 1]) { seen[idx - 1] = true; stack[sp++] = idx - 1 }
                              if (y + 1 < h && label[idx + w].toInt() == c && !seen[idx + w]) { seen[idx + w] = true; stack[sp++] = idx + w }
                              if (y > 0 && label[idx - w].toInt() == c && !seen[idx - w]) { seen[idx - w] = true; stack[sp++] = idx - w }
                          }
                          if (n < 30 || minY <= top) continue
                          val bw = maxX - minX + 1; val bh = maxY - minY + 1
                          val fill = n.toFloat() / (bw * bh)
                          val aspect = bw.toFloat() / bh
                          val big = maxOf(bw, bh)
                          val cx = sumX.toFloat() / n; val cy = sumY.toFloat() / n
                          if (big <= 75 && aspect in 0.6f..1.66f && fill >= 0.5f) {
                              val blob = floatArrayOf(cx, cy, n.toFloat(), c.toFloat())
                              if (ringScore(cx, cy, (bw + bh) / 4f, c, hue, sat, w, h) >= 0.45f) specials.add(blob) else normal.add(blob)
                          } else if (big <= 150 && fill >= 0.35f && (aspect > 1.66f || aspect < 0.6f)) {
                              val horizontal = aspect > 1f
                              val mid = if (horizontal) (minX + maxX) / 2f else (minY + maxY) / 2f
                              var ax = 0L; var ay = 0L; var an = 0; var bx = 0L; var by = 0L; var bn = 0
                              for (idx in members) {
                                  val x = idx % w; val y = idx / w
                                  if ((if (horizontal) x.toFloat() else y.toFloat()) < mid) { ax += x; ay += y; an++ } else { bx += x; by += y; bn++ }
                              }
                              if (an > 0) normal.add(floatArrayOf(ax.toFloat() / an, ay.toFloat() / an, an.toFloat(), c.toFloat()))
                              if (bn > 0) normal.add(floatArrayOf(bx.toFloat() / bn, by.toFloat() / bn, bn.toFloat(), c.toFloat()))
                          }
                      }

                      val dt = (now - prevFrameAt).coerceAtLeast(1L).toFloat()
                      recentTaps.removeAll { nowRel - it[2] > tapCooldownMs }
                      val current = ArrayList<FloatArray>()
                      fun aim(bl: FloatArray): PointF {
                          val bx = (bl[0] + 0.5f) * sx; val by = (bl[1] + 0.5f) * sy
                          var tx = bx; var ty = by
                          if (dt < 250f) {
                              val prev = prevBlobs.minByOrNull { hypot(it[0] - bx, it[1] - by) }
                              if (prev != null && hypot(prev[0] - bx, prev[1] - by) < 120f) {
                                  val ahead = leadMs + hits.size * tapGapMs
                                  tx += ((bx - prev[0]) / dt).coerceIn(-1.5f, 1.5f) * ahead
                                  ty += ((by - prev[1]) / dt).coerceIn(-1.5f, 1.5f) * ahead
                              }
                          }
                          return PointF(tx.coerceIn(1f, screenW - 2f), ty.coerceIn(1f, screenH - 2f))
                      }
                      for (bl in normal + specials) current.add(floatArrayOf((bl[0] + 0.5f) * sx, (bl[1] + 0.5f) * sy))

                      // 3. special ringed balloons: strictly blue -> red -> yellow -> green
                      if (specials.isNotEmpty()) specialLastSeen = now
                      else if (now - specialLastSeen > 3000) { nextSpecial = 0; pendingSpecial = null }
                      val pend = pendingSpecial
                      if (pend != null && nowRel - pend[3] > 150f) {
                          // did the last special pop? if it is still there, tap it again, otherwise move on
                          val still = specials.any { it[3].toInt() == pend[2].toInt() &&
                                  hypot((it[0] + 0.5f) * sx - pend[0], (it[1] + 0.5f) * sy - pend[1]) < 140f }
                          pendingSpecial = null
                          if (!still) nextSpecial = (pend[2].toInt() + 1) % 4
                      }
                      if (pendingSpecial == null) {
                          val target = specials.filter { it[3].toInt() == nextSpecial }.maxByOrNull { it[2] }
                          if (target != null) {
                              val p = aim(target)
                              if (!onOverlay(p.x, p.y)) {
                                  hits.add(p)
                                  pendingSpecial = floatArrayOf(p.x, p.y, nextSpecial.toFloat(), nowRel)
                              }
                          }
                      }

                      // 4. normal balloons of the ticked colours, biggest first, no double taps
                      normal.sortByDescending { it[2] }
                      for (bl in normal) {
                          if (hits.size >= maxTaps) break
                          if (!enabledColours[bl[3].toInt()]) continue
                          val bx = (bl[0] + 0.5f) * sx; val by = (bl[1] + 0.5f) * sy
                          val radius = kotlin.math.sqrt(bl[2] / 3.14f) * sx
                          if (recentTaps.any { hypot(it[0] - bx, it[1] - by) < maxOf(radius * 1.3f, 90f) }) continue
                          val p = aim(bl)
                          if (onOverlay(p.x, p.y)) continue
                          hits.add(p)
                          recentTaps.add(floatArrayOf(bx, by, nowRel))
                      }
                      prevBlobs = current
                      prevFrameAt = now
                  } finally {
                      img.close()
                  }

                  val tapper = TapService.instance
                  if (tapper == null) {
                      running = false
                      Handler(Looper.getMainLooper()).post {
                          overlay?.text = "START"
                          Toast.makeText(this, "Turn on Balloon Tapper in Accessibility settings", Toast.LENGTH_LONG).show()
                      }
                      return
                  }
                  if (hits.isNotEmpty()) {
                      busy = true
                      tapper.tapMany(hits, tapGapMs) {
                          nextScanAt = SystemClock.uptimeMillis() + 60
                          busy = false
                      }
                  }
              }

              /** How much of a thin ring of the same colour surrounds this balloon (0..1). */
              private fun ringScore(cx: Float, cy: Float, r: Float, c: Int, hue: FloatArray, sat: FloatArray, w: Int, h: Int): Float {
                  var best = 0f
                  for (k in 24..45) {
                      val rad = r * k / 20f
                      var hit = 0; var tot = 0
                      for (a in 0 until 48) {
                          val t = a * Math.PI.toFloat() / 24f
                          val cs = kotlin.math.cos(t); val sn = kotlin.math.sin(t)
                          val xi = (cx + cs * (rad - 3)).toInt(); val yi = (cy + sn * (rad - 3)).toInt()
                          val xo = (cx + cs * (rad + 3)).toInt(); val yo = (cy + sn * (rad + 3)).toInt()
                          if (xi !in 0 until w || xo !in 0 until w || yi !in 0 until h || yo !in 0 until h) continue
                          tot++
                          val sIn = sat[yi * w + xi]; val sOut = sat[yo * w + xo]
                          for (dr in -1..1) {
                              val x = (cx + cs * (rad + dr)).toInt(); val y = (cy + sn * (rad + dr)).toInt()
                              if (x !in 0 until w || y !in 0 until h) continue
                              val k2 = y * w + x
                              if (hueDiff(hue[k2], RING_HUE[c]) <= 14f && sat[k2] >= 0.2f && sat[k2] > sIn + 0.08f && sat[k2] > sOut + 0.08f) { hit++; break }
                          }
                      }
                      if (tot >= 24) best = maxOf(best, hit.toFloat() / tot)
                  }
                  return best
              }

              private fun onOverlay(x: Float, y: Float): Boolean {
                  val p = overlayParams ?: return false
                  val v = overlay ?: return false
                  val pad = 40
                  return x >= p.x - pad && x <= p.x + v.width + pad && y >= p.y - pad && y <= p.y + v.height + pad
              }

              @SuppressLint("ClickableViewAccessibility", "SetTextI18n")
              private fun showOverlay() {
                  val tv = TextView(this).apply {
                      text = "START"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(200, 30, 30, 30))
                      setPadding(36, 24, 36, 24)
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 30; y = 300 }

                  var downX = 0f; var downY = 0f; var startX = 0; var startY = 0
                  var downTime = 0L; var moved = false
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY; startX = params.x; startY = params.y
                              downTime = SystemClock.uptimeMillis(); moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX; val dy = e.rawY - downY
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              if (moved) {
                                  params.x = startX + dx.toInt(); params.y = startY + dy.toInt()
                                  wm.updateViewLayout(tv, params)
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) {
                              if (SystemClock.uptimeMillis() - downTime > 800) {
                                  stopSelf()      // long-press = quit
                              } else {
                                  running = !running
                                  tv.text = if (running) "STOP" else "START"
                              }
                          }
                      }
                      true
                  }
                  wm.addView(tv, params)
                  overlay = tv
                  overlayParams = params
              }

              override fun onDestroy() {
                  running = false
                  overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  virtualDisplay?.release()
                  reader?.close()
                  projection?.stop()
                  projection = null
                  if (::thread.isInitialized) thread.quitSafely()
                  super.onDestroy()
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/MainActivity.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private var checks: List<CheckBox> = emptyList()
              private lateinit var maxTaps: EditText
              private lateinit var skipTop: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun label(t: String) = TextView(this).apply { text = t; setPadding(0, pad, 0, 0) }
                  fun button(t: String, onClick: (View) -> Unit) =
                      Button(this).apply { text = t; setOnClickListener(onClick) }

                  status = TextView(this).apply { textSize = 15f }
                  root.addView(status)

                  root.addView(label("Balloon colours to pop (grey balloons are always skipped)"))
                  val colourNames = listOf("blue" to "Blue", "red" to "Red", "yellow" to "Yellow", "green" to "Green")
                  checks = colourNames.map { (key, name) ->
                      CheckBox(this).apply { text = name; isChecked = prefs.getBoolean(key, true); tag = key }.also { root.addView(it) }
                  }

                  root.addView(label("Max taps per scan"))
                  maxTaps = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("maxTaps", 15).toString()) }
                  root.addView(maxTaps)

                  root.addView(label("Ignore top % of screen (score bar etc.)"))
                  skipTop = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("skipTop", 8).toString()) }
                  root.addView(skipTop)

                  root.addView(button("1. Allow floating button") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("2. Turn on tap service (Accessibility)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  root.addView(button("3. Stop battery saver killing the app") {
                      val pm = getSystemService(android.os.PowerManager::class.java)
                      if (pm.isIgnoringBatteryOptimizations(packageName)) toast("Already allowed")
                      else startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("4. Save & launch overlay") { launch() })

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onResume() {
                  super.onResume()
                  val overlayOk = Settings.canDrawOverlays(this)
                  val tapOk = TapService.instance != null
                  status.text = "Floating button permission: ${if (overlayOk) "OK" else "NO"}\n" +
                          "Tap service: ${if (tapOk) "OK" else "NO"}"
              }

              private fun launch() {
                  val ed = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                  checks.forEach { ed.putBoolean(it.tag as String, it.isChecked) }
                  ed.putInt("maxTaps", maxTaps.text.toString().toIntOrNull()?.coerceIn(1, 30) ?: 15)
                      .putInt("skipTop", skipTop.text.toString().toIntOrNull()?.coerceIn(0, 90) ?: 8)
                      .apply()

                  if (!Settings.canDrawOverlays(this)) { toast("Do step 1 first"); return }
                  if (TapService.instance == null) { toast("Do step 2 first"); return }
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 2)

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), 1)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 1) return
                  if (resultCode != RESULT_OK || data == null) { toast("Screen capture is needed to find balloons"); return }
                  startForegroundService(Intent(this, CaptureService::class.java)
                      .putExtra("code", resultCode).putExtra("data", data))
                  toast("Open your game and tap START")
                  moveTaskToBack(true)
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }
          ENDOFFILE
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonTapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
