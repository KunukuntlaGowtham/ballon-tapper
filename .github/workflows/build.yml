              android:canPerformGestures="true" />
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/Humanizer.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.graphics.PointF
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.ln
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          /**
           * Makes the tapper play like a person instead of a machine.
           *
           * A person needs a moment to notice a balloon, aims somewhere on it rather than dead centre,
           * moves one finger from balloon to balloon, taps at an uneven rhythm, fumbles one now and then,
           * misses a balloon that was right there, glances away for a beat and slows down as the hand tires.
           * Everything here is the same idea: take a number the machine would keep exactly, and stop keeping
           * it exactly.
           */
          class Humanizer {

              companion object {
                  const val OFF = 0        // the old machine behaviour: instant, perfect, relentless
                  const val CASUAL = 1     // someone playing with one thumb on the sofa
                  const val FOCUSED = 2    // someone actually trying, but still a person
              }

              var level = CASUAL
              val on: Boolean get() = level != OFF
              val name: String get() = when (level) { FOCUSED -> "focused" ; CASUAL -> "casual" ; else -> "machine" }

              private val rnd = Random(System.nanoTime())
              private val sight = ArrayList<FloatArray>()      // x, y, firstSeen, lastSeen
              private val hand = PointF(-1f, -1f)
              private var pauseUntil = 0L
              private var nextPauseAt = 0L
              private var tiredness = 0f                       // 0 = fresh, 1 = worn out

              /** Bell-curve random value. Real timings and real aim scatter like this, not evenly. */
              fun gauss(mean: Float, sd: Float): Float {
                  val u1 = maxOf(1e-6f, rnd.nextFloat())
                  val u2 = rnd.nextFloat()
                  val z = (sqrt(-2f * ln(u1)) * cos(2f * PI.toFloat() * u2)).coerceIn(-2.5f, 2.5f)
                  return mean + sd * z
              }

              fun chance(p: Float) = rnd.nextFloat() < p

              // --- noticing a balloon ------------------------------------------------

              /** How long a balloon has to be on screen before a person reacts to it. */
              fun reactionMs(): Float =
                  if (level == FOCUSED) gauss(170f, 45f).coerceIn(90f, 340f)
                  else gauss(255f, 75f).coerceIn(140f, 520f)

              /**
               * Remembers where balloons were, so we know how long this one has been in view.
               * Returns the age in ms of the remembered balloon nearest to (x, y), 0 if it is new.
               */
              fun ageOf(x: Float, y: Float, now: Long): Float {
                  var best: FloatArray? = null
                  var bestD = 150f
                  for (s in sight) {
                      val d = hypot(s[0] - x, s[1] - y)
                      if (d < bestD) { bestD = d; best = s }
                  }
                  val b = best
                  if (b == null) {
                      sight.add(floatArrayOf(x, y, now.toFloat(), now.toFloat()))
                      return 0f
                  }
                  b[0] = x; b[1] = y; b[3] = now.toFloat()
                  return now - b[2]
              }

              fun forgetOld(now: Long) {
                  sight.removeAll { now - it[3] > 600f }
                  if (sight.size > 400) sight.subList(0, sight.size - 400).clear()
              }

              // --- aiming ------------------------------------------------------------

              /** A thumb lands somewhere on the balloon, and every so often just beside it. */
              fun aim(x: Float, y: Float, radius: Float): PointF {
                  val r = maxOf(12f, radius)
                  if (chance(if (level == FOCUSED) 0.02f else 0.05f)) {
                      val t = rnd.nextFloat() * 2f * PI.toFloat()
                      val off = r * gauss(1.25f, 0.15f)
                      return PointF(x + cos(t) * off, y + sin(t) * off)     // fumbled: lands just off the balloon
                  }
                  val spread = if (level == FOCUSED) 0.28f else 0.40f
                  return PointF(x + gauss(0f, r * spread), y + gauss(0f, r * spread))
              }

              /** Attention slips: a balloon right there sometimes just doesn't get tapped. */
              fun ignores() = chance(if (level == FOCUSED) 0.03f else 0.07f)

              /** Nobody predicts a moving balloon perfectly, so lead it by a wrong amount. */
              fun leadNoise(): Float = gauss(1f, 0.25f).coerceIn(0.4f, 1.6f)

              // --- rhythm ------------------------------------------------------------

              /** How many balloons get tapped before the eyes go looking again. */
              fun burstLimit(): Int = if (level == FOCUSED) 3 + rnd.nextInt(2) else 2 + rnd.nextInt(2)

              /** How long the finger stays down. */
              fun holdMs(): Long =
                  (if (level == FOCUSED) gauss(62f, 18f) else gauss(88f, 28f)).coerceIn(35f, 190f).toLong()

              /** Time to move the finger to the next balloon: further away takes longer (Fitts, roughly). */
              fun travelMs(from: PointF, to: PointF, density: Float): Long {
                  val dist = if (from.x < 0f) 0f else hypot(to.x - from.x, to.y - from.y) / maxOf(1f, density)
                  val base = if (level == FOCUSED) 55f else 80f
                  val perDp = if (level == FOCUSED) 0.22f else 0.32f
                  return (gauss(base + dist * perDp, 22f) * tiredFactor()).coerceIn(35f, 900f).toLong()
              }

              /** Pause after a burst, while the eyes pick the next balloons. */
              fun settleMs(): Long =
                  ((if (level == FOCUSED) gauss(110f, 40f) else gauss(180f, 70f)) * tiredFactor())
                      .coerceIn(50f, 900f).toLong()

              /** Fingers slide a little while they press; a perfectly still touch is a giveaway. */
              fun drift(): PointF {
                  var dx = gauss(0f, 2.6f)
                  var dy = gauss(0f, 2.6f)
                  if (abs(dx) < 1f) dx = if (dx < 0f) -1f else 1f
                  if (abs(dy) < 1f) dy = if (dy < 0f) -1f else 1f
                  return PointF(dx, dy)
              }

              fun handAt(): PointF = PointF(hand.x, hand.y)
              fun handMovedTo(p: PointF) { hand.set(p.x, p.y) }

              // --- the hand over time ------------------------------------------------

              private fun tiredFactor(): Float = 1f + tiredness * 0.35f

              /** Slows down over a long session, with sharper patches and sloppier ones along the way. */
              fun tick(playedMs: Long) {
                  val stint = (playedMs / 600000f).coerceIn(0f, 1f)          // ten minutes is a full stint
                  val wave = (sin(playedMs / 23000f) + 1f) / 2f
                  tiredness = (stint * 0.7f + wave * 0.3f).coerceIn(0f, 1f)
              }

              /** Every few seconds a person glances away, shifts grip, or simply hesitates. */
              fun restingAt(now: Long): Boolean {
                  if (now < pauseUntil) return true
                  if (nextPauseAt == 0L) { nextPauseAt = now + pauseSpacing(); return false }
                  if (now >= nextPauseAt) {
                      val len = if (chance(0.15f)) gauss(1500f, 450f) else gauss(430f, 150f)
                      pauseUntil = now + len.coerceIn(150f, 2800f).toLong()
                      nextPauseAt = pauseUntil + pauseSpacing()
                      return true
                  }
                  return false
              }

              private fun pauseSpacing(): Long =
                  gauss(if (level == FOCUSED) 9000f else 5500f, 2200f).coerceIn(2000f, 20000f).toLong()
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/TapService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.PointF
          import android.view.accessibility.AccessibilityEvent

          /** Performs the actual taps. Must be enabled in Settings > Accessibility. */
          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              /** One tap as a person makes it: where, when, how long, and how far the finger slides. */
              class Tap(val x: Float, val y: Float, val startMs: Long, val holdMs: Long, val dx: Float, val dy: Float)

              /** Plays a sequence of taps with their own timings, then calls done(). */
              fun tapTaps(taps: List<Tap>, done: () -> Unit) {
                  if (taps.isEmpty()) { done(); return }
                  val maxStrokes = maxOf(1, GestureDescription.getMaxStrokeCount())
                  val chunks = taps.chunked(maxStrokes)
                  fun send(i: Int) {
                      if (i >= chunks.size) { done(); return }
                      val chunk = chunks[i]
                      val base = chunk.first().startMs
                      val ok = try {
                          val builder = GestureDescription.Builder()
                          for (t in chunk) {
                              val x = maxOf(0f, t.x); val y = maxOf(0f, t.y)
                              val path = Path().apply {
                                  moveTo(x, y)
                                  lineTo(maxOf(0f, x + t.dx), maxOf(0f, y + t.dy))
                              }
                              builder.addStroke(GestureDescription.StrokeDescription(
                                  path, maxOf(0L, t.startMs - base), maxOf(1L, t.holdMs)))
                          }
                          dispatchGesture(builder.build(), object : GestureResultCallback() {
                              override fun onCompleted(g: GestureDescription?) = send(i + 1)
                              override fun onCancelled(g: GestureDescription?) = send(i + 1)
                          }, null)
                      } catch (e: Exception) {
                          android.util.Log.e("BalloonTapper", "human tap error", e)
                          false
                      }
                      if (!ok) done()
                  }
                  send(0)
              }

              /** Taps points one after another, spaced by gapMs, then calls done(). */
              fun tapMany(points: List<PointF>, gapMs: Long, holdMs: Long, done: () -> Unit) {
                  val fingers = 1
                  val maxStrokes = GestureDescription.getMaxStrokeCount()
                  val batch = if (maxStrokes >= fingers) maxStrokes - maxStrokes % fingers else maxOf(1, maxStrokes)
                  val perGroup = minOf(fingers, batch)
                  val chunks = points.chunked(batch)
                  fun send(i: Int) {
                      if (i >= chunks.size) { done(); return }
                      val ok = try {
                          val builder = GestureDescription.Builder()
                          chunks[i].forEachIndexed { k, pt ->
                              val path = Path().apply { moveTo(maxOf(0f, pt.x), maxOf(0f, pt.y)) }
                              val groupStart = (k / perGroup) * gapMs   // one tap at a time
                              builder.addStroke(GestureDescription.StrokeDescription(path, groupStart, holdMs))
                          }
                          dispatchGesture(builder.build(), object : GestureResultCallback() {
                              override fun onCompleted(g: GestureDescription?) = send(i + 1)
                              override fun onCancelled(g: GestureDescription?) = send(i + 1)
                          }, null)
                      } catch (e: Exception) {
                          android.util.Log.e("BalloonTapper", "tap error", e)
                          false
                      }
                      if (!ok) done()
                  }
                  if (chunks.isEmpty()) done() else send(0)
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/DetectionView.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.PointF
          import android.os.SystemClock
          import android.view.View

          /**
           * See-through layer that shows what the tapper sees: rings on detected balloons,
           * numbered badges on special balloons and a burst on every tap.
           * Colours are white and magenta on purpose, so the detector never mistakes them for balloons.
           */
          class DetectionView(ctx: Context) : View(ctx) {

              // x, y, radius, kind  (kind 0 = normal, 1..4 = special order, +10 = the special that's next)
              @Volatile private var targets = FloatArray(0)
              private val bursts = ArrayList<FloatArray>()   // x, y, bornAt
              private val lock = Any()

              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4f; color = Color.argb(200, 255, 255, 255)
              }
              private val special = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 7f; color = Color.WHITE
                  pathEffect = DashPathEffect(floatArrayOf(22f, 12f), 0f)
              }
              private val next = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 10f; color = Color.rgb(255, 0, 220)
              }
              private val burst = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 8f; color = Color.rgb(255, 0, 220)
              }
              private val badge = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textSize = 46f; isFakeBoldText = true; textAlign = Paint.Align.CENTER
                  setShadowLayer(8f, 0f, 0f, Color.BLACK)
              }

              fun setTargets(t: FloatArray) {
                  targets = t
                  postInvalidateOnAnimation()
              }

              fun addTaps(points: List<PointF>) {
                  val now = SystemClock.uptimeMillis().toFloat()
                  synchronized(lock) {
                      for (p in points) bursts.add(floatArrayOf(p.x, p.y, now))
                      if (bursts.size > 200) bursts.subList(0, bursts.size - 200).clear()
                  }
                  postInvalidateOnAnimation()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val t = targets
                  var i = 0
                  while (i + 3 < t.size) {
                      val x = t[i]; val y = t[i + 1]; val r = t[i + 2]; val kind = t[i + 3].toInt()
                      when {
                          kind == 0 -> canvas.drawCircle(x, y, r, ring)
                          kind > 10 -> {
                              canvas.drawCircle(x, y, r + 14f, next)
                              canvas.drawText((kind - 10).toString(), x, y - r - 26f, badge)
                          }
                          else -> {
                              canvas.drawCircle(x, y, r + 10f, special)
                              canvas.drawText(kind.toString(), x, y - r - 22f, badge)
                          }
                      }
                      i += 4
                  }

                  val now = SystemClock.uptimeMillis().toFloat()
                  var alive = false
                  synchronized(lock) {
                      val it = bursts.iterator()
                      while (it.hasNext()) {
                          val b = it.next()
                          val age = (now - b[2]) / 280f
                          if (age >= 1f) { it.remove(); continue }
                          alive = true
                          burst.alpha = ((1f - age) * 255).toInt()
                          canvas.drawCircle(b[0], b[1], 18f + age * 60f, burst)
                      }
                  }
                  if (alive) postInvalidateOnAnimation()
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/CaptureService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Point
          import android.graphics.PointF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Log
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin
          import kotlin.math.sqrt

          /** Watches the screen, finds balloons and taps them. Built to keep running no matter what. */
          class CaptureService : Service() {

              companion object {
                  private const val TAG = "BalloonTapper"
                  // colour, hueMin, hueMax, satMin, satMax, valMin (tuned on Google Store Playground screenshots)
                  private val RULES = arrayOf(
                      floatArrayOf(0f, 203f, 222f, 0.45f, 1.00f, 0.55f),
                      floatArrayOf(1f, 0f, 14f, 0.60f, 1.00f, 0.75f),
                      floatArrayOf(1f, 355f, 360f, 0.60f, 1.00f, 0.75f),
                      floatArrayOf(2f, 44f, 64f, 0.30f, 1.00f, 0.65f),
                      floatArrayOf(3f, 128f, 154f, 0.35f, 0.74f, 0.62f)
                  )
                  private val RING_HUE = floatArrayOf(213f, 3f, 51f, 133f)
                  private const val SCALE = 4
              }

              // capture
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private lateinit var thread: HandlerThread
              private lateinit var handler: Handler
              private lateinit var wm: WindowManager
              private val mainHandler = Handler(Looper.getMainLooper())
              private var screenW = 0
              private var screenH = 0

              // overlay
              private var overlay: TextView? = null
              private var fxView: DetectionView? = null
              private var showFx = true

              // stats for the floating button
              private var totalTaps = 0
              private val tapLog = ArrayDeque<LongArray>()       // time, count
              private var lastUiAt = 0L
              private var overlayParams: WindowManager.LayoutParams? = null
              @Volatile private var captureLost = false

              // state
              @Volatile private var running = false
              @Volatile private var busy = false
              @Volatile private var busySince = 0L
              @Volatile private var busyLimitMs = 2500L
              @Volatile private var nextScanAt = 0L
              private var loopStarted = false

              // reusable buffers (no garbage per frame = no stutter)
              private var bw = 0
              private var bh = 0
              private var label = ByteArray(0)
              private var hue = FloatArray(0)
              private var sat = FloatArray(0)
              private var seen = BooleanArray(0)
              private var stack = IntArray(0)
              private var members = IntArray(0)
              private val hs = FloatArray(2)

              // tap memory, aiming and special order
              private val startedAt = SystemClock.uptimeMillis()
              private val recentTaps = ArrayList<FloatArray>()     // x, y, time
              private var prevBlobs = ArrayList<FloatArray>()      // x, y
              private var prevFrameAt = 0L
              private val tapCooldownMs = 300f
              private val leadMs = 60f
              private var nextSpecial = 0
              private var frenzyUntil = 0L                         // rush mode when the screen floods with balloons
              private var specialLastSeen = 0L
              private var pendingSpecial: FloatArray? = null       // x, y, colour, time

              // settings
              private var enabledColours = booleanArrayOf(true, true, true, true)
              private var maxTaps = 6
              private var skipTopPct = 8
              private var tapGapMs = 6L
              private var tapHoldMs = 6L
              private var settleMs = 30L
              private var loopMs = 12L
              private var customGapMs = 0L
              private val humanizer = Humanizer()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startAsForeground()
                  if (!::thread.isInitialized) {
                      thread = HandlerThread("scanner", android.os.Process.THREAD_PRIORITY_URGENT_DISPLAY).apply { start() }
                      handler = Handler(thread.looper)
                      wm = getSystemService(WindowManager::class.java)
                  }
                  loadSettings()
                  if (showFx && fxView == null) showDetectionView()
                  if (!showFx && fxView != null) { try { wm.removeView(fxView) } catch (_: Throwable) {}; fxView = null }
                  if (overlay == null) showOverlay()

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33)
                      intent?.getParcelableExtra("data", Intent::class.java)
                  else @Suppress("DEPRECATION") intent?.getParcelableExtra("data")

                  if (data != null) {
                      releaseCapture()
                      try {
                          startCapture(code, data)
                          captureLost = false
                          setButton()
                      } catch (t: Throwable) {
                          Log.e(TAG, "capture start failed", t)
                          captureLost = true
                          setButton()
                      }
                  }
                  if (!loopStarted) { loopStarted = true; handler.post(loop) }
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("tapper", "Balloon Tapper", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "tapper")
                      .setContentTitle("Balloon Tapper is running")
                      .setContentText("Long-press the floating button to quit")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setOngoing(true)
                      .build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                      else startForeground(1, n)
                  } catch (t: Throwable) {
                      Log.e(TAG, "foreground failed", t)
                  }
              }

              private fun loadSettings() {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  enabledColours = booleanArrayOf(
                      p.getBoolean("blue", true), p.getBoolean("red", true), p.getBoolean("yellow", true), p.getBoolean("green", true)
                  )
                  maxTaps = p.getInt("maxTaps", 6)
                  skipTopPct = p.getInt("skipTop", 8)
                  showFx = p.getBoolean("fx", true)
                  // taps go out one after another; tapGapMs = pause between taps
                  when (p.getInt("speed", 1)) {
                      0 -> { tapGapMs = 120L; tapHoldMs = 40L; settleMs = 80L; loopMs = 25L }
                      1 -> { tapGapMs = 70L; tapHoldMs = 30L; settleMs = 60L; loopMs = 20L }
                      else -> { tapGapMs = 40L; tapHoldMs = 25L; settleMs = 40L; loopMs = 15L }
                  }
                  // optional fixed gap chosen by the user (0 = use the speed mode)
                  customGapMs = p.getInt("gapMs", 0).toLong()
                  if (customGapMs > 0) { tapGapMs = customGapMs; tapHoldMs = minOf(tapHoldMs, maxOf(4L, customGapMs - 1)) }
                  // play style: the human levels work out their own timings and ignore the speed above
                  humanizer.level = p.getInt("human", Humanizer.CASUAL).coerceIn(Humanizer.OFF, Humanizer.FOCUSED)
              }

              private fun startCapture(code: Int, data: Intent) {
                  val size = Point()
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.maximumWindowMetrics.bounds
                      size.set(b.width(), b.height())
                  } else @Suppress("DEPRECATION") wm.defaultDisplay.getRealSize(size)
                  screenW = size.x
                  screenH = size.y

                  val w = screenW / SCALE
                  val h = screenH / SCALE
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          // Android stopped screen capture (screen locked, call, etc.). Keep the app alive and ask to resume.
                          Log.w(TAG, "projection stopped")
                          captureLost = true
                          releaseCapture()
                          setButton()
                      }
                  }, handler)

                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "tapper", w, h, maxOf(1, resources.displayMetrics.densityDpi / SCALE),
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler
                  )
              }

              private fun releaseCapture() {
                  try { virtualDisplay?.release() } catch (_: Throwable) {}
                  try { reader?.close() } catch (_: Throwable) {}
                  val p = projection
                  projection = null
                  virtualDisplay = null
                  reader = null
                  try { p?.stop() } catch (_: Throwable) {}
              }

              /** The main loop. Whatever happens inside, it always schedules itself again. */
              private val loop = object : Runnable {
                  override fun run() {
                      try {
                          val now = SystemClock.uptimeMillis()
                          // watchdog: if a tap batch never reported back, don't stay stuck
                          if (busy && now - busySince > busyLimitMs) busy = false
                          if (running && !busy && now >= nextScanAt && reader != null) scanAndTap()
                          else reader?.acquireLatestImage()?.close()
                      } catch (t: Throwable) {
                          busy = false
                          Log.e(TAG, "loop error", t)
                      } finally {
                          handler.postDelayed(this, loopMs)
                      }
                  }
              }

              private fun ensureBuffers(w: Int, h: Int) {
                  if (w == bw && h == bh) return
                  bw = w; bh = h
                  val n = w * h
                  label = ByteArray(n); hue = FloatArray(n); sat = FloatArray(n)
                  seen = BooleanArray(n); stack = IntArray(n); members = IntArray(n)
              }

              private fun colourMatch(r: Int, g: Int, b: Int): Int {
                  val mx = maxOf(r, maxOf(g, b)); val mn = minOf(r, minOf(g, b)); val d = mx - mn
                  if (mx == 0 || d == 0) { hs[0] = 0f; hs[1] = 0f; return -1 }
                  val s = d.toFloat() / mx
                  var h = when (mx) {
                      r -> 60f * (g - b) / d
                      g -> 60f * (b - r) / d + 120f
                      else -> 60f * (r - g) / d + 240f
                  }
                  if (h < 0) h += 360f
                  hs[0] = h; hs[1] = s
                  val v = mx / 255f
                  for (rule in RULES) {
                      if (h >= rule[1] && h <= rule[2] && s >= rule[3] && s <= rule[4] && v >= rule[5]) return rule[0].toInt()
                  }
                  return -1
              }

              private fun hueDiff(a: Float, b: Float): Float {
                  val d = abs(a - b) % 360f
                  return minOf(d, 360f - d)
              }

              private fun scanAndTap() {
                  val img = reader?.acquireLatestImage() ?: return
                  val now = SystemClock.uptimeMillis()
                  val nowRel = (now - startedAt).toFloat()
                  val human = humanizer.on
                  if (human) { humanizer.tick(now - startedAt); humanizer.forgetOld(now) }
                  val reactMs = if (human) humanizer.reactionMs() else 0f
                  val resting = human && humanizer.restingAt(now)   // looking away, shifting grip, hesitating
                  val hits = ArrayList<PointF>()
                  try {
                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val px = plane.pixelStride
                      val w = img.width
                      val h = img.height
                      val limit = buf.limit()
                      ensureBuffers(w, h)
                      val sx = screenW.toFloat() / w
                      val sy = screenH.toFloat() / h
                      val top = h * skipTopPct / 100

                      // 1. colour label for every pixel
                      for (y in 0 until h) {
                          val row = y * rowStride
                          for (x in 0 until w) {
                              val i = row + x * px
                              val k = y * w + x
                              if (i + 2 >= limit) { label[k] = (-1).toByte(); hue[k] = 0f; sat[k] = 0f; continue }
                              val c = colourMatch(buf.get(i).toInt() and 0xff, buf.get(i + 1).toInt() and 0xff, buf.get(i + 2).toInt() and 0xff)
                              hue[k] = hs[0]; sat[k] = hs[1]
                              label[k] = if (y >= top) c.toByte() else (-1).toByte()
                          }
                      }
                      java.util.Arrays.fill(seen, false)

                      // 2. blobs
                      val normal = ArrayList<FloatArray>()     // cx, cy, size, colour (scaled px)
                      val specials = ArrayList<FloatArray>()
                      val total = w * h
                      for (start in 0 until total) {
                          val c = label[start].toInt()
                          if (c < 0 || seen[start]) continue
                          var sp = 0; stack[sp++] = start; seen[start] = true
                          var n = 0; var sumX = 0L; var sumY = 0L
                          var minX = w; var maxX = 0; var minY = h; var maxY = 0
                          while (sp > 0) {
                              val idx = stack[--sp]; val x = idx % w; val y = idx / w
                              members[n++] = idx; sumX += x; sumY += y
                              if (x < minX) minX = x
                              if (x > maxX) maxX = x
                              if (y < minY) minY = y
                              if (y > maxY) maxY = y
                              if (x + 1 < w && label[idx + 1].toInt() == c && !seen[idx + 1]) { seen[idx + 1] = true; stack[sp++] = idx + 1 }
                              if (x > 0 && label[idx - 1].toInt() == c && !seen[idx - 1]) { seen[idx - 1] = true; stack[sp++] = idx - 1 }
                              if (y + 1 < h && label[idx + w].toInt() == c && !seen[idx + w]) { seen[idx + w] = true; stack[sp++] = idx + w }
                              if (y > 0 && label[idx - w].toInt() == c && !seen[idx - w]) { seen[idx - w] = true; stack[sp++] = idx - w }
                          }
                          if (n < 30 || minY <= top) continue
                          val bwid = maxX - minX + 1; val bhei = maxY - minY + 1
                          val fill = n.toFloat() / (bwid * bhei)
                          val aspect = bwid.toFloat() / bhei
                          val big = maxOf(bwid, bhei)
                          val cx = sumX.toFloat() / n; val cy = sumY.toFloat() / n

                          if (big <= 75 && aspect in 0.6f..1.66f && fill >= 0.5f) {
                              // single balloon
                              val blob = floatArrayOf(cx, cy, n.toFloat(), c.toFloat())
                              if (ringScore(cx, cy, (bwid + bhei) / 4f, c, w, h) >= 0.45f) specials.add(blob) else normal.add(blob)
                          } else if (fill >= 0.30f) {
                              // crowd of touching balloons: tap the middle of each filled grid cell
                              val cell = 18
                              val cols = bwid / cell + 1; val rows = bhei / cell + 1
                              val cnt = IntArray(cols * rows); val gx = LongArray(cols * rows); val gy = LongArray(cols * rows)
                              for (m in 0 until n) {
                                  val idx = members[m]; val x = idx % w; val y = idx / w
                                  val g = ((y - minY) / cell) * cols + (x - minX) / cell
                                  cnt[g]++; gx[g] += x.toLong(); gy[g] += y.toLong()
                              }
                              for (g in 0 until cols * rows) {
                                  if (cnt[g] >= cell * cell * 0.40f)
                                      normal.add(floatArrayOf(gx[g].toFloat() / cnt[g], gy[g].toFloat() / cnt[g], cnt[g].toFloat(), c.toFloat()))
                              }
                          }
                      }

                      // 3. aiming helpers
                      val dt = (now - prevFrameAt).coerceAtLeast(1L).toFloat()
                      recentTaps.removeAll { nowRel - it[2] > tapCooldownMs }
                      val current = ArrayList<FloatArray>(normal.size + specials.size)
                      for (bl in normal) current.add(floatArrayOf((bl[0] + 0.5f) * sx, (bl[1] + 0.5f) * sy))
                      for (bl in specials) current.add(floatArrayOf((bl[0] + 0.5f) * sx, (bl[1] + 0.5f) * sy))
                      fun aim(bl: FloatArray): PointF {
                          val bx = (bl[0] + 0.5f) * sx; val by = (bl[1] + 0.5f) * sy
                          var tx = bx; var ty = by
                          if (dt < 250f && prevBlobs.isNotEmpty()) {
                              var best: FloatArray? = null; var bestD = 120f
                              for (pb in prevBlobs) { val d = hypot(pb[0] - bx, pb[1] - by); if (d < bestD) { bestD = d; best = pb } }
                              if (best != null) {
                                  // a person leads a rising balloon by roughly the right amount, never exactly
                                  val ahead = if (human) (leadMs + hits.size * 130f) * humanizer.leadNoise()
                                              else leadMs + hits.size * tapGapMs
                                  tx += ((bx - best[0]) / dt).coerceIn(-1.5f, 1.5f) * ahead
                                  ty += ((by - best[1]) / dt).coerceIn(-1.5f, 1.5f) * ahead
                              }
                          }
                          if (human) {
                              val p = humanizer.aim(tx, ty, sqrt(bl[2] / 3.14f) * sx)
                              tx = p.x; ty = p.y
                          }
                          return PointF(tx.coerceIn(1f, screenW - 2f), ty.coerceIn(1f, screenH - 2f))
                      }

                      // 4. special ringed balloons: blue -> red -> yellow -> green
                      if (specials.isNotEmpty()) specialLastSeen = now
                      else if (now - specialLastSeen > 3000) { nextSpecial = 0; pendingSpecial = null }
                      val pend = pendingSpecial
                      if (pend != null && nowRel - pend[3] > 150f) {
                          val still = specials.any {
                              it[3].toInt() == pend[2].toInt() && hypot((it[0] + 0.5f) * sx - pend[0], (it[1] + 0.5f) * sy - pend[1]) < 140f
                          }
                          pendingSpecial = null
                          if (!still) nextSpecial = (pend[2].toInt() + 1) % 4
                      }
                      if (pendingSpecial == null && !resting) {
                          val target = specials.filter { it[3].toInt() == nextSpecial }.maxByOrNull { it[2] }
                          if (target != null) {
                              val noticed = !human ||
                                  humanizer.ageOf((target[0] + 0.5f) * sx, (target[1] + 0.5f) * sy, now) >= reactMs
                              val p = aim(target)
                              if (noticed && !onOverlay(p.x, p.y)) {
                                  hits.add(p)
                                  pendingSpecial = floatArrayOf(p.x, p.y, nextSpecial.toFloat(), nowRel)
                              }
                          }
                      }

                      // 5. normal balloons. When the screen floods, switch to rush mode for a moment.
                      if (normal.size >= 12) frenzyUntil = now + 1500
                      val frenzy = now < frenzyUntil
                      // one hand can only manage a few taps before it has to move and look again
                      val tapLimit = when {
                          resting -> 0
                          human -> minOf(maxTaps, if (frenzy) humanizer.burstLimit() + 1 else humanizer.burstLimit())
                          frenzy -> maxOf(maxTaps * 2, 12)
                          else -> maxTaps
                      }
                      val minGuard = if (frenzy && !human) 32f else 50f
                      recentTaps.removeAll { nowRel - it[2] > (if (frenzy && !human) 180f else tapCooldownMs) }
                      val ages = HashMap<FloatArray, Float>()
                      if (human && !resting) {
                          // the eyes take in the whole screen, then the hand reaches for what is nearest
                          // it, with half an eye on what is about to escape off the top
                          val hand = humanizer.handAt()
                          val order = HashMap<FloatArray, Float>(normal.size * 2)
                          for (bl in normal) {
                              val bx = (bl[0] + 0.5f) * sx; val by = (bl[1] + 0.5f) * sy
                              ages[bl] = humanizer.ageOf(bx, by, now)
                              val reach = if (hand.x < 0f) 0f else hypot(hand.x - bx, hand.y - by)
                              order[bl] = by * 0.55f + reach * 0.45f + humanizer.gauss(0f, 70f)
                          }
                          normal.sortBy { order[it] ?: 0f }
                      } else if (!human) {
                          // balloons closest to escaping off the top go first, then bigger ones
                          normal.sortWith(compareBy<FloatArray> { it[1] }.thenByDescending { it[2] })
                      }
                      for (bl in normal) {
                          if (hits.size >= tapLimit) break
                          if (!enabledColours[bl[3].toInt()]) continue
                          val bx = (bl[0] + 0.5f) * sx; val by = (bl[1] + 0.5f) * sy
                          if (human) {
                              if ((ages[bl] ?: 0f) < reactMs) continue   // the eyes haven't caught it yet
                              if (humanizer.ignores()) continue          // looked straight past it
                          }
                          val guard = maxOf(sqrt(bl[2] / 3.14f) * sx * 0.7f, minGuard)
                          var blocked = false
                          for (t in recentTaps) if (hypot(t[0] - bx, t[1] - by) < guard) { blocked = true; break }
                          if (blocked) continue
                          val p = aim(bl)
                          if (onOverlay(p.x, p.y)) continue
                          hits.add(p)
                          recentTaps.add(floatArrayOf(bx, by, nowRel))
                      }
                      prevBlobs = current
                      prevFrameAt = now

                      // live detection view (about 30 updates a second)
                      val fx = fxView
                      if (fx != null && now - lastUiAt >= 33) {
                          lastUiAt = now
                          val arr = FloatArray((normal.size + specials.size) * 4)
                          var o = 0
                          for (bl in normal) {
                              if (!enabledColours[bl[3].toInt()]) continue
                              arr[o++] = (bl[0] + 0.5f) * sx; arr[o++] = (bl[1] + 0.5f) * sy
                              arr[o++] = minOf(sqrt(bl[2] / 3.14f) * sx, 140f); arr[o++] = 0f
                          }
                          for (bl in specials) {
                              val c = bl[3].toInt()
                              arr[o++] = (bl[0] + 0.5f) * sx; arr[o++] = (bl[1] + 0.5f) * sy
                              arr[o++] = minOf(sqrt(bl[2] / 3.14f) * sx, 140f)
                              arr[o++] = (c + 1 + if (c == nextSpecial) 10 else 0).toFloat()
                          }
                          fx.setTargets(arr.copyOf(o))
                      }
                  } finally {
                      try { img.close() } catch (_: Throwable) {}
                  }

                  updateStats(hits.size)
                  if (hits.isEmpty()) return
                  fxView?.addTaps(hits)
                  val tapper = TapService.instance
                  if (tapper == null) {
                      mainHandler.post { overlay?.text = "TURN ON TAP SERVICE\nin Accessibility settings" }
                      return
                  }
                  busy = true
                  busySince = SystemClock.uptimeMillis()
                  if (humanizer.on) {
                      // one finger, travelling from balloon to balloon, pressing for an uneven moment each time
                      val density = resources.displayMetrics.density
                      val taps = ArrayList<TapService.Tap>(hits.size)
                      var from = humanizer.handAt()
                      var at = 0L
                      for (p in hits) {
                          at += humanizer.travelMs(from, p, density)
                          val hold = humanizer.holdMs()
                          val d = humanizer.drift()
                          taps.add(TapService.Tap(p.x, p.y, at, hold, d.x, d.y))
                          at += hold
                          from = p
                      }
                      humanizer.handMovedTo(hits.last())
                      val settle = humanizer.settleMs()
                      busyLimitMs = at + 2000L
                      tapper.tapTaps(taps) {
                          nextScanAt = SystemClock.uptimeMillis() + settle
                          busy = false
                      }
                  } else {
                      val rush = SystemClock.uptimeMillis() < frenzyUntil
                      val gap = if (rush && customGapMs == 0L) minOf(tapGapMs, 30L) else tapGapMs
                      val hold = if (rush && customGapMs == 0L) minOf(tapHoldMs, 20L) else tapHoldMs
                      val settle = if (rush) minOf(settleMs, 20L) else settleMs
                      busyLimitMs = 2500L
                      tapper.tapMany(hits, gap, hold) {
                          nextScanAt = SystemClock.uptimeMillis() + settle
                          busy = false
                      }
                  }
              }

              /** How much of a thin same-colour ring surrounds this balloon (0..1). */
              private fun ringScore(cx: Float, cy: Float, r: Float, c: Int, w: Int, h: Int): Float {
                  var best = 0f
                  var k = 24
                  while (k <= 45) {
                      val rad = r * k / 20f
                      var hit = 0; var tot = 0
                      for (a in 0 until 40) {
                          val t = a * (Math.PI.toFloat() * 2f / 40f)
                          val cs = cos(t); val sn = sin(t)
                          val xi = (cx + cs * (rad - 3)).toInt(); val yi = (cy + sn * (rad - 3)).toInt()
                          val xo = (cx + cs * (rad + 3)).toInt(); val yo = (cy + sn * (rad + 3)).toInt()
                          if (xi !in 0 until w || xo !in 0 until w || yi !in 0 until h || yo !in 0 until h) continue
                          tot++
                          val sIn = sat[yi * w + xi]; val sOut = sat[yo * w + xo]
                          for (dr in -1..1) {
                              val x = (cx + cs * (rad + dr)).toInt(); val y = (cy + sn * (rad + dr)).toInt()
                              if (x !in 0 until w || y !in 0 until h) continue
                              val q = y * w + x
                              if (hueDiff(hue[q], RING_HUE[c]) <= 14f && sat[q] >= 0.2f && sat[q] > sIn + 0.08f && sat[q] > sOut + 0.08f) { hit++; break }
                          }
                      }
                      if (tot >= 20) best = maxOf(best, hit.toFloat() / tot)
                      k += 1
                  }
                  return best
              }

              private fun onOverlay(x: Float, y: Float): Boolean {
                  val p = overlayParams ?: return false
                  val v = overlay ?: return false
                  val pad = 40
                  return x >= p.x - pad && x <= p.x + v.width + pad && y >= p.y - pad && y <= p.y + v.height + pad
              }

              private fun updateStats(count: Int) {
                  val now = SystemClock.uptimeMillis()
                  if (count > 0) { totalTaps += count; tapLog.addLast(longArrayOf(now, count.toLong())) }
                  while (tapLog.isNotEmpty() && now - tapLog.first()[0] > 1000) tapLog.removeFirst()
                  rateNow = tapLog.sumOf { it[1] }
                  if (now - lastStatsAt < 250) return
                  lastStatsAt = now
                  setButton()
              }
              private var lastStatsAt = 0L
              @Volatile private var rateNow = 0L
              private val colourNames = arrayOf("BLUE", "RED", "YELLOW", "GREEN")

              private fun setButton() {
                  val rate = rateNow
                  val rush = SystemClock.uptimeMillis() < frenzyUntil
                  val txt = when {
                      captureLost -> "\u21BB RESUME"
                      running -> "\u25A0 STOP" + (if (rush && !humanizer.on) "   \u26A1RUSH" else "") +
                              (if (humanizer.on) "   \u00B7 ${humanizer.name}" else "") +
                              "\n$totalTaps taps  \u00B7  $rate/s" +
                              "\nnext special: ${colourNames[nextSpecial]}"
                      else -> "\u25B6 START" + (if (totalTaps > 0) "\n$totalTaps taps" else "")
                  }
                  val bg = when {
                      captureLost -> Color.argb(215, 180, 90, 0)
                      rush && running -> Color.argb(215, 150, 0, 130)
                      running -> Color.argb(215, 25, 25, 35)
                      else -> Color.argb(215, 60, 60, 70)
                  }
                  mainHandler.post {
                      overlay?.text = txt
                      overlay?.setBackgroundColor(bg)
                  }
              }

              private fun showDetectionView() {
                  val v = DetectionView(this)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      alpha = 0.75f   // below Android's pass-through limit, so taps still reach the game
                      if (Build.VERSION.SDK_INT >= 28)
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  try { wm.addView(v, params); fxView = v } catch (t: Throwable) { Log.e(TAG, "fx view failed", t) }
              }

              @SuppressLint("ClickableViewAccessibility", "SetTextI18n")
              private fun showOverlay() {
                  val tv = TextView(this).apply {
                      text = "\u25B6 START"
                      textSize = 14f
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(200, 30, 30, 30))
                      setPadding(36, 24, 36, 24)
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 30; y = 300 }

                  var downX = 0f; var downY = 0f; var startX = 0; var startY = 0
                  var downTime = 0L; var moved = false
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY; startX = params.x; startY = params.y
                              downTime = SystemClock.uptimeMillis(); moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX; val dy = e.rawY - downY
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              if (moved) {
                                  params.x = startX + dx.toInt(); params.y = startY + dy.toInt()
                                  try { wm.updateViewLayout(tv, params) } catch (_: Throwable) {}
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) {
                              when {
                                  SystemClock.uptimeMillis() - downTime > 800 -> stopSelf()   // long-press = quit
                                  captureLost -> {
                                      // screen capture was stopped by Android: ask for it again, then carry on
                                      running = true
                                      startActivity(Intent(this, MainActivity::class.java)
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                                          .putExtra("resume", true))
                                  }
                                  else -> {
                                      running = !running
                                      busy = false
                                      if (!running) fxView?.setTargets(FloatArray(0))
                                      setButton()
                                  }
                              }
                          }
                      }
                      true
                  }
                  try { wm.addView(tv, params) } catch (t: Throwable) { Log.e(TAG, "overlay failed", t) }
                  overlay = tv
                  overlayParams = params
              }

              override fun onDestroy() {
                  running = false
                  overlay?.let { try { wm.removeView(it) } catch (_: Throwable) {} }
                  overlay = null
                  fxView?.let { try { wm.removeView(it) } catch (_: Throwable) {} }
                  fxView = null
                  releaseCapture()
                  if (::thread.isInitialized) { handler.removeCallbacksAndMessages(null); thread.quitSafely() }
                  super.onDestroy()
              }
          }
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/MainActivity.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private var checks: List<CheckBox> = emptyList()
              private lateinit var speedGroup: RadioGroup
              private lateinit var styleGroup: RadioGroup
              private lateinit var fxCheck: CheckBox
              private lateinit var gapInput: EditText
              private lateinit var maxTaps: EditText
              private lateinit var skipTop: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun label(t: String) = TextView(this).apply { text = t; setPadding(0, pad, 0, 0) }
                  fun button(t: String, onClick: (View) -> Unit) =
                      Button(this).apply { text = t; setOnClickListener(onClick) }

                  status = TextView(this).apply { textSize = 15f }
                  root.addView(status)

                  root.addView(label("Balloon colours to pop (grey balloons are always skipped)"))
                  val colourNames = listOf("blue" to "Blue", "red" to "Red", "yellow" to "Yellow", "green" to "Green")
                  checks = colourNames.map { (key, name) ->
                      CheckBox(this).apply { text = name; isChecked = prefs.getBoolean(key, true); tag = key }.also { root.addView(it) }
                  }

                  root.addView(label("Max taps per scan"))
                  maxTaps = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("maxTaps", 6).toString()) }
                  root.addView(maxTaps)

                  root.addView(label("Ignore top % of screen (score bar etc.)"))
                  skipTop = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("skipTop", 8).toString()) }
                  root.addView(skipTop)

                  root.addView(button("1. Allow floating button") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("2. Turn on tap service (Accessibility)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  fxCheck = CheckBox(this).apply { text = "Live detection view (rings + tap bursts)"; isChecked = prefs.getBoolean("fx", true) }
                  root.addView(fxCheck)

                  root.addView(label("Play style"))
                  val styleNames = listOf(
                      "Machine - instant, perfect aim, never stops",
                      "Human - casual (uneven rhythm, misses a few, takes breaks)",
                      "Human - focused (quicker and steadier, still a person)"
                  )
                  styleGroup = RadioGroup(this).apply { orientation = RadioGroup.VERTICAL }
                  styleNames.forEachIndexed { i, name ->
                      styleGroup.addView(RadioButton(this).apply { text = name; id = 200 + i })
                  }
                  styleGroup.check(200 + prefs.getInt("human", Humanizer.CASUAL))
                  root.addView(styleGroup)

                  root.addView(label("Tap speed (used by the machine style only)"))
                  val speedNames = listOf("Relaxed (1 tap every 120 ms)", "Normal (1 tap every 70 ms)", "Quick (1 tap every 40 ms)")
                  speedGroup = RadioGroup(this).apply { orientation = RadioGroup.VERTICAL }
                  speedNames.forEachIndexed { i, name ->
                      speedGroup.addView(RadioButton(this).apply { text = name; id = 100 + i })
                  }
                  speedGroup.check(100 + prefs.getInt("speed", 1))
                  root.addView(speedGroup)

                  root.addView(label("Fixed gap between taps in ms (leave 0 to use the speed above)"))
                  gapInput = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("gapMs", 0).toString()) }
                  root.addView(gapInput)

                  root.addView(button("3. Stop battery saver killing the app") {
                      val pm = getSystemService(android.os.PowerManager::class.java)
                      if (pm.isIgnoringBatteryOptimizations(packageName)) toast("Already allowed")
                      else startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("4. Save & launch overlay") { launch() })

                  setContentView(ScrollView(this).apply { addView(root) })
                  if (intent?.getBooleanExtra("resume", false) == true) root.post { launch() }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.getBooleanExtra("resume", false)) launch()
              }

              override fun onResume() {
                  super.onResume()
                  val overlayOk = Settings.canDrawOverlays(this)
                  val tapOk = TapService.instance != null
                  status.text = "Floating button permission: ${if (overlayOk) "OK" else "NO"}\n" +
                          "Tap service: ${if (tapOk) "OK" else "NO"}"
              }

              private fun launch() {
                  val ed = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                  checks.forEach { ed.putBoolean(it.tag as String, it.isChecked) }
                  ed.putBoolean("fx", fxCheck.isChecked)
                  ed.putInt("gapMs", gapInput.text.toString().toIntOrNull()?.let { if (it <= 0) 0 else it.coerceIn(5, 2000) } ?: 0)
                  ed.putInt("speed", (speedGroup.checkedRadioButtonId - 100).coerceIn(0, 2))
                  ed.putInt("human", (styleGroup.checkedRadioButtonId - 200).coerceIn(0, 2))
                  ed.putInt("maxTaps", maxTaps.text.toString().toIntOrNull()?.coerceIn(1, 30) ?: 6)
                      .putInt("skipTop", skipTop.text.toString().toIntOrNull()?.coerceIn(0, 90) ?: 8)
                      .apply()

                  if (!Settings.canDrawOverlays(this)) { toast("Do step 1 first"); return }
                  if (TapService.instance == null) { toast("Do step 2 first"); return }
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 2)

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), 1)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 1) return
                  if (resultCode != RESULT_OK || data == null) { toast("Screen capture is needed to find balloons"); return }
                  startForegroundService(Intent(this, CaptureService::class.java)
                      .putExtra("code", resultCode).putExtra("data", data))
                  toast("Open your game and tap START")
                  moveTaskToBack(true)
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }
          ENDOFFILE
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonTapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
