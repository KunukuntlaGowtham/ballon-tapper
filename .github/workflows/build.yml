name: Build Balloon Tapper APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BalloonTapper"
          include(":app")
          ENDOFFILE
          cat > build.gradle.kts <<'ENDOFFILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ENDOFFILE
          cat > gradle.properties <<'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          ENDOFFILE
          mkdir -p app
          cat > app/build.gradle.kts <<'ENDOFFILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.balloontapper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.balloontapper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          ENDOFFILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="Balloon Tapper"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ENDOFFILE'
          <resources>
              <string name="acc_desc">Lets Balloon Tapper tap on screen where your chosen colours appear.</string>
          </resources>
          ENDOFFILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/tap_service.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/acc_desc"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true" />
          ENDOFFILE
          mkdir -p app/src/main/java/com/example/balloontapper
          cat > app/src/main/java/com/example/balloontapper/TapService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.PointF
          import android.view.accessibility.AccessibilityEvent

          /** Performs the actual taps. Must be enabled in Settings > Accessibility. */
          class TapService : AccessibilityService() {

              companion object { @Volatile var instance: TapService? = null }

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(intent: Intent?): Boolean { instance = null; return super.onUnbind(intent) }

              /** One finger visiting each point in turn, spaced by gapMs, then done(). */
              fun tapMany(points: List<PointF>, gapMs: Long, holdMs: Long, done: () -> Unit) {
                  if (points.isEmpty()) { done(); return }
                  val n = minOf(points.size, maxOf(1, GestureDescription.getMaxStrokeCount()))
                  val ok = try {
                      val b = GestureDescription.Builder()
                      for (i in 0 until n) {
                          val p = points[i]
                          val path = Path().apply { moveTo(maxOf(0f, p.x), maxOf(0f, p.y)) }
                          b.addStroke(GestureDescription.StrokeDescription(path, i * (gapMs + holdMs), maxOf(1L, holdMs)))
                      }
                      dispatchGesture(b.build(), object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) = done()
                          override fun onCancelled(g: GestureDescription?) = done()
                      }, null)
                  } catch (e: Exception) {
                      android.util.Log.e("BalloonTapper", "tap error", e); false
                  }
                  if (!ok) done()
              }
          }
          ENDOFFILE
          cat > app/src/main/java/com/example/balloontapper/CaptureService.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Point
          import android.graphics.PointF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Log
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.sqrt

          /** Watches the screen, finds balloons of the chosen colours and taps them at a calm pace. */
          class CaptureService : Service() {

              companion object {
                  private const val TAG = "BalloonTapper"
                  // colour, hueMin, hueMax, satMin, satMax, valMin (tuned on the balloon game)
                  private val RULES = arrayOf(
                      floatArrayOf(0f, 203f, 222f, 0.45f, 1.00f, 0.55f),
                      floatArrayOf(1f, 0f, 14f, 0.60f, 1.00f, 0.75f),
                      floatArrayOf(1f, 355f, 360f, 0.60f, 1.00f, 0.75f),
                      floatArrayOf(2f, 44f, 64f, 0.30f, 1.00f, 0.65f),
                      floatArrayOf(3f, 128f, 154f, 0.35f, 0.74f, 0.62f)
                  )
                  private const val SCALE = 5
              }

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private lateinit var thread: HandlerThread
              private lateinit var handler: Handler
              private lateinit var wm: WindowManager
              private val mainHandler = Handler(Looper.getMainLooper())
              private var screenW = 0
              private var screenH = 0

              private var overlay: TextView? = null
              private var overlayParams: WindowManager.LayoutParams? = null
              private var totalTaps = 0

              @Volatile private var captureLost = false
              @Volatile private var running = false
              @Volatile private var busy = false
              @Volatile private var busySince = 0L
              @Volatile private var nextScanAt = 0L
              private var loopStarted = false
              private var lastSizeCheck = 0L
              private var lastResumeAt = 0L

              private var bw = 0
              private var bh = 0
              private var label = ByteArray(0)
              private var hue = FloatArray(0)
              private var sat = FloatArray(0)
              private var seen = BooleanArray(0)
              private var stack = IntArray(0)
              private var members = IntArray(0)
              private val hs = FloatArray(2)

              private var enabledColours = booleanArrayOf(true, true, true, true)
              private var maxTaps = 6
              private var skipTopPct = 8
              private var gapMs = 70L
              private var holdMs = 30L
              private var settleMs = 60L
              private var loopMs = 18L

              private val recent = ArrayList<FloatArray>()   // x, y, time (screen px)
              private val rnd = java.util.Random()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startAsForeground()
                  if (!::thread.isInitialized) {
                      thread = HandlerThread("scanner", android.os.Process.THREAD_PRIORITY_URGENT_DISPLAY).apply { start() }
                      handler = Handler(thread.looper)
                      wm = getSystemService(WindowManager::class.java)
                  }
                  loadSettings()
                  if (overlay == null) showOverlay()

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33)
                      intent?.getParcelableExtra("data", Intent::class.java)
                  else @Suppress("DEPRECATION") intent?.getParcelableExtra("data")

                  if (data != null) {
                      releaseCapture()
                      try {
                          startCapture(code, data)
                          captureLost = false
                          running = true
                          saveRunning(true)
                      } catch (t: Throwable) {
                          Log.e(TAG, "capture start failed", t); captureLost = true
                      }
                      setButton()
                  } else if (projection == null) {
                      if (loadRunning()) { running = true; captureLost = true; mainHandler.post { autoResume() } }
                      setButton()
                  }
                  if (!loopStarted) { loopStarted = true; handler.post(loop) }
                  return START_REDELIVER_INTENT
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("tapper", "Balloon Tapper", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "tapper")
                      .setContentTitle("Balloon Tapper is running")
                      .setContentText("Long-press the floating button to quit")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setOngoing(true).build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                      else startForeground(1, n)
                  } catch (t: Throwable) { Log.e(TAG, "foreground failed", t) }
              }

              private fun loadSettings() {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  enabledColours = booleanArrayOf(
                      p.getBoolean("blue", true), p.getBoolean("red", true),
                      p.getBoolean("yellow", true), p.getBoolean("green", true)
                  )
                  maxTaps = p.getInt("maxTaps", 6).coerceIn(1, 12)
                  skipTopPct = p.getInt("skipTop", 8).coerceIn(0, 90)
                  when (p.getInt("speed", 1)) {
                      0 -> { gapMs = 120L; holdMs = 40L; settleMs = 90L; loopMs = 24L }
                      1 -> { gapMs = 70L; holdMs = 30L; settleMs = 60L; loopMs = 18L }
                      else -> { gapMs = 40L; holdMs = 25L; settleMs = 40L; loopMs = 14L }
                  }
              }

              private fun saveRunning(on: Boolean) {
                  try { getSharedPreferences("cfg", MODE_PRIVATE).edit().putBoolean("wasRunning", on).apply() } catch (_: Throwable) {}
              }
              private fun loadRunning(): Boolean =
                  try { getSharedPreferences("cfg", MODE_PRIVATE).getBoolean("wasRunning", false) } catch (_: Throwable) { false }

              private fun currentScreenSize(): Point {
                  val s = Point()
                  if (Build.VERSION.SDK_INT >= 30) { val b = wm.maximumWindowMetrics.bounds; s.set(b.width(), b.height()) }
                  else @Suppress("DEPRECATION") wm.defaultDisplay.getRealSize(s)
                  return s
              }

              private fun startCapture(code: Int, data: Intent) {
                  val size = currentScreenSize()
                  screenW = size.x; screenH = size.y
                  val w = screenW / SCALE; val h = screenH / SCALE
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          Log.w(TAG, "projection stopped"); captureLost = true; releaseCapture(); setButton()
                          if (running || loadRunning()) mainHandler.post { autoResume() }
                      }
                  }, handler)
                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "tapper", w, h, maxOf(1, resources.displayMetrics.densityDpi / SCALE),
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler)
              }

              /** Keep the mirror matched to the live screen (games hide the bars / rotate when they go fullscreen). */
              private fun syncCaptureSize() {
                  val proj = projection ?: return
                  val size = currentScreenSize()
                  if ((size.x == screenW && size.y == screenH) || size.x <= 0 || size.y <= 0) return
                  screenW = size.x; screenH = size.y
                  val w = screenW / SCALE; val h = screenH / SCALE
                  try {
                      val old = reader
                      val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      val vd = virtualDisplay
                      if (vd != null) {
                          vd.resize(w, h, maxOf(1, resources.displayMetrics.densityDpi / SCALE))
                          vd.surface = r.surface; reader = r
                      } else {
                          reader = r
                          virtualDisplay = proj.createVirtualDisplay("tapper", w, h,
                              maxOf(1, resources.displayMetrics.densityDpi / SCALE),
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler)
                      }
                      try { old?.close() } catch (_: Throwable) {}
                      ensureBuffers(w, h)
                  } catch (t: Throwable) { Log.e(TAG, "resize failed", t) }
              }

              private fun releaseCapture() {
                  try { virtualDisplay?.release() } catch (_: Throwable) {}
                  try { reader?.close() } catch (_: Throwable) {}
                  val p = projection
                  projection = null; virtualDisplay = null; reader = null
                  try { p?.stop() } catch (_: Throwable) {}
              }

              private fun autoResume() {
                  val now = SystemClock.uptimeMillis()
                  if (now - lastResumeAt < 4000) return
                  lastResumeAt = now
                  try {
                      running = true; saveRunning(true)
                      startActivity(Intent(this, MainActivity::class.java)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          .putExtra("resume", true))
                  } catch (t: Throwable) { Log.e(TAG, "auto resume failed", t) }
              }

              private val loop = object : Runnable {
                  override fun run() {
                      try {
                          val now = SystemClock.uptimeMillis()
                          if (busy && now - busySince > 2500) busy = false
                          if (running && projection != null && now - lastSizeCheck > 400) { lastSizeCheck = now; syncCaptureSize() }
                          if (running && !busy && now >= nextScanAt && reader != null) scanAndTap()
                          else reader?.acquireLatestImage()?.close()
                      } catch (t: Throwable) { busy = false; Log.e(TAG, "loop error", t) }
                      finally { handler.postDelayed(this, loopMs) }
                  }
              }

              private fun ensureBuffers(w: Int, h: Int) {
                  if (w == bw && h == bh) return
                  bw = w; bh = h
                  val n = w * h
                  label = ByteArray(n); hue = FloatArray(n); sat = FloatArray(n)
                  seen = BooleanArray(n); stack = IntArray(n); members = IntArray(n)
              }

              private fun colourMatch(r: Int, g: Int, b: Int): Int {
                  val mx = maxOf(r, maxOf(g, b)); val mn = minOf(r, minOf(g, b)); val d = mx - mn
                  if (mx == 0 || d == 0) { hs[0] = 0f; hs[1] = 0f; return -1 }
                  val s = d.toFloat() / mx
                  if (s < 0.20f) { hs[0] = 0f; hs[1] = s; return -1 }
                  var h = when (mx) {
                      r -> 60f * (g - b) / d
                      g -> 60f * (b - r) / d + 120f
                      else -> 60f * (r - g) / d + 240f
                  }
                  if (h < 0) h += 360f
                  hs[0] = h; hs[1] = s
                  if (s < 0.30f) return -1
                  val v = mx / 255f
                  for (rule in RULES) if (h >= rule[1] && h <= rule[2] && s >= rule[3] && s <= rule[4] && v >= rule[5]) return rule[0].toInt()
                  return -1
              }

              private fun jitter(r: Float): Float {
                  val z = (rnd.nextGaussian().toFloat()).coerceIn(-2f, 2f)
                  return (z * r * 0.22f).coerceIn(-r * 0.6f, r * 0.6f)   // land on the balloon, not dead centre
              }

              private fun onOverlay(x: Float, y: Float): Boolean {
                  val p = overlayParams ?: return false
                  val v = overlay ?: return false
                  val vw = if (v.width > 0) v.width else 360
                  val vh = if (v.height > 0) v.height else 130
                  val pad = 60
                  return x >= p.x - pad && x <= p.x + vw + pad && y >= p.y - pad && y <= p.y + vh + pad
              }

              private fun scanAndTap() {
                  val img = reader?.acquireLatestImage() ?: return
                  val now = SystemClock.uptimeMillis()
                  val hits = ArrayList<PointF>()
                  try {
                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val px = plane.pixelStride
                      val w = img.width; val h = img.height
                      val limit = buf.limit()
                      ensureBuffers(w, h)
                      val sx = screenW.toFloat() / w; val sy = screenH.toFloat() / h
                      val top = h * skipTopPct / 100

                      if (top > 0) java.util.Arrays.fill(label, 0, minOf(top * w, label.size), (-1).toByte())
                      for (y in top until h) {
                          val row = y * rowStride; val kRow = y * w
                          for (x in 0 until w) {
                              val i = row + x * px; val k = kRow + x
                              if (i + 2 >= limit) { label[k] = (-1).toByte(); continue }
                              label[k] = colourMatch(buf.get(i).toInt() and 0xff, buf.get(i + 1).toInt() and 0xff, buf.get(i + 2).toInt() and 0xff).toByte()
                          }
                      }
                      java.util.Arrays.fill(seen, false)

                      val targets = ArrayList<FloatArray>()   // cx, cy, size, colour (scaled px)
                      val total = w * h
                      for (start in 0 until total) {
                          val c = label[start].toInt()
                          if (c < 0 || seen[start]) continue
                          var sp = 0; stack[sp++] = start; seen[start] = true
                          var count = 0; var sumX = 0L; var sumY = 0L
                          var minX = w; var maxX = 0; var minY = h; var maxY = 0
                          while (sp > 0) {
                              val idx = stack[--sp]; val x = idx % w; val y = idx / w
                              members[count++] = idx; sumX += x; sumY += y
                              if (x < minX) minX = x; if (x > maxX) maxX = x
                              if (y < minY) minY = y; if (y > maxY) maxY = y
                              if (x + 1 < w && label[idx + 1].toInt() == c && !seen[idx + 1]) { seen[idx + 1] = true; stack[sp++] = idx + 1 }
                              if (x > 0 && label[idx - 1].toInt() == c && !seen[idx - 1]) { seen[idx - 1] = true; stack[sp++] = idx - 1 }
                              if (y + 1 < h && label[idx + w].toInt() == c && !seen[idx + w]) { seen[idx + w] = true; stack[sp++] = idx + w }
                              if (y > 0 && label[idx - w].toInt() == c && !seen[idx - w]) { seen[idx - w] = true; stack[sp++] = idx - w }
                          }
                          if (count < 12 || minY <= top) continue
                          val bwid = maxX - minX + 1; val bhei = maxY - minY + 1
                          val fill = count.toFloat() / (bwid * bhei)
                          val aspect = bwid.toFloat() / bhei
                          val big = maxOf(bwid, bhei)
                          val cx = sumX.toFloat() / count; val cy = sumY.toFloat() / count
                          if (big <= 150 && aspect in 0.6f..1.66f && fill >= 0.5f) {
                              targets.add(floatArrayOf(cx, cy, count.toFloat(), c.toFloat()))
                          } else if (fill >= 0.30f) {
                              val cell = 18
                              val cols = bwid / cell + 1; val rows = bhei / cell + 1
                              val cnt = IntArray(cols * rows); val gx = LongArray(cols * rows); val gy = LongArray(cols * rows)
                              for (m in 0 until count) {
                                  val idx = members[m]; val x = idx % w; val y = idx / w
                                  val gI = ((y - minY) / cell) * cols + (x - minX) / cell
                                  cnt[gI]++; gx[gI] += x.toLong(); gy[gI] += y.toLong()
                              }
                              for (gI in 0 until cols * rows) if (cnt[gI] >= cell * cell * 0.40f)
                                  targets.add(floatArrayOf(gx[gI].toFloat() / cnt[gI], gy[gI].toFloat() / cnt[gI], cnt[gI].toFloat(), c.toFloat()))
                          }
                      }

                      targets.sortBy { it[1] }   // closest to escaping off the top first
                      recent.removeAll { now - it[2].toLong() > 300 }
                      for (t in targets) {
                          if (hits.size >= maxTaps) break
                          val c = t[3].toInt()
                          if (!enabledColours[c]) continue
                          val bx = (t[0] + 0.5f) * sx; val by = (t[1] + 0.5f) * sy
                          val r = sqrt(t[2] / 3.14f) * sx
                          val guard = maxOf(r * 0.7f, 50f)
                          var blocked = false
                          for (rt in recent) if (hypot(rt[0] - bx, rt[1] - by) < guard) { blocked = true; break }
                          if (blocked) continue
                          val px2 = (bx + jitter(r)).coerceIn(1f, screenW - 2f)
                          val py2 = (by + jitter(r)).coerceIn(1f, screenH - 2f)
                          if (onOverlay(px2, py2)) continue
                          hits.add(PointF(px2, py2))
                          recent.add(floatArrayOf(bx, by, now.toFloat()))
                      }
                  } finally {
                      try { img.close() } catch (_: Throwable) {}
                  }

                  if (hits.isEmpty()) return
                  val tapper = TapService.instance
                  if (tapper == null) {
                      mainHandler.post { overlay?.text = "TURN ON TAP SERVICE\nin Accessibility settings" }
                      return
                  }
                  busy = true; busySince = SystemClock.uptimeMillis()
                  tapper.tapMany(hits, gapMs, holdMs) {
                      nextScanAt = SystemClock.uptimeMillis() + settleMs
                      busy = false
                  }
                  totalTaps += hits.size
                  setButton()
              }

              private fun setButton() {
                  val txt = when {
                      captureLost -> "↻ RESUME"
                      running -> "■ STOP" + (if (totalTaps > 0) "\n$totalTaps taps" else "")
                      else -> "▶ START" + (if (totalTaps > 0) "\n$totalTaps taps" else "")
                  }
                  val bg = when {
                      captureLost -> Color.argb(215, 180, 90, 0)
                      running -> Color.argb(215, 25, 25, 35)
                      else -> Color.argb(215, 60, 60, 70)
                  }
                  mainHandler.post { overlay?.text = txt; overlay?.setBackgroundColor(bg) }
              }

              @android.annotation.SuppressLint("ClickableViewAccessibility", "SetTextI18n")
              private fun showOverlay() {
                  val tv = TextView(this).apply {
                      text = "▶ START"; textSize = 14f
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE); setBackgroundColor(Color.argb(200, 30, 30, 30))
                      setPadding(36, 24, 36, 24)
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 30; y = 300 }

                  var downX = 0f; var downY = 0f; var startX = 0; var startY = 0
                  var downTime = 0L; var moved = false
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY; startX = params.x; startY = params.y
                              downTime = SystemClock.uptimeMillis(); moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX; val dy = e.rawY - downY
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              if (moved) { params.x = startX + dx.toInt(); params.y = startY + dy.toInt()
                                  try { wm.updateViewLayout(tv, params) } catch (_: Throwable) {} }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) {
                              when {
                                  SystemClock.uptimeMillis() - downTime > 800 -> { saveRunning(false); stopSelf() }
                                  captureLost -> autoResume()
                                  else -> { running = !running; saveRunning(running); busy = false; setButton() }
                              }
                          }
                      }
                      true
                  }
                  try { wm.addView(tv, params) } catch (t: Throwable) { Log.e(TAG, "overlay failed", t) }
                  overlay = tv; overlayParams = params
              }

              override fun onDestroy() {
                  running = false
                  overlay?.let { try { wm.removeView(it) } catch (_: Throwable) {} }
                  overlay = null
                  releaseCapture()
                  if (::thread.isInitialized) { handler.removeCallbacksAndMessages(null); thread.quitSafely() }
                  super.onDestroy()
              }
          }
          ENDOFFILE
          cat > app/src/main/java/com/example/balloontapper/MainActivity.kt <<'ENDOFFILE'
          package com.example.balloontapper

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private var checks: List<CheckBox> = emptyList()
              private lateinit var speedGroup: RadioGroup
              private lateinit var maxTaps: EditText
              private lateinit var skipTop: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }
                  fun label(t: String) = TextView(this).apply { text = t; setPadding(0, pad, 0, 0) }
                  fun button(t: String, onClick: (View) -> Unit) = Button(this).apply { text = t; setOnClickListener(onClick) }

                  status = TextView(this).apply { textSize = 15f }
                  root.addView(status)

                  root.addView(label("Balloon colours to pop (grey balloons are always skipped)"))
                  val colourNames = listOf("blue" to "Blue", "red" to "Red", "yellow" to "Yellow", "green" to "Green")
                  checks = colourNames.map { (key, name) ->
                      CheckBox(this).apply { text = name; isChecked = prefs.getBoolean(key, true); tag = key }.also { root.addView(it) }
                  }

                  root.addView(label("Max taps per scan"))
                  maxTaps = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("maxTaps", 6).toString()) }
                  root.addView(maxTaps)

                  root.addView(label("Ignore top % of screen (score bar etc.)"))
                  skipTop = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(prefs.getInt("skipTop", 8).toString()) }
                  root.addView(skipTop)

                  root.addView(label("Tap speed"))
                  val speedNames = listOf("Relaxed", "Normal", "Quick")
                  speedGroup = RadioGroup(this).apply { orientation = RadioGroup.VERTICAL }
                  speedNames.forEachIndexed { i, name -> speedGroup.addView(RadioButton(this).apply { text = name; id = 100 + i }) }
                  speedGroup.check(100 + prefs.getInt("speed", 1))
                  root.addView(speedGroup)

                  root.addView(button("1. Allow floating button") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("2. Turn on tap service (Accessibility)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  root.addView(button("3. Stop battery saver killing the app") {
                      val pm = getSystemService(android.os.PowerManager::class.java)
                      if (pm.isIgnoringBatteryOptimizations(packageName)) toast("Already allowed")
                      else startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("4. Save & launch overlay") { launch() })

                  setContentView(ScrollView(this).apply { addView(root) })
                  if (intent?.getBooleanExtra("resume", false) == true) root.post { launch() }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.getBooleanExtra("resume", false)) launch()
              }

              override fun onResume() {
                  super.onResume()
                  val overlayOk = Settings.canDrawOverlays(this)
                  val tapOk = TapService.instance != null
                  status.text = "Floating button permission: ${if (overlayOk) "OK" else "NO"}\n" +
                          "Tap service: ${if (tapOk) "OK" else "NO"}"
              }

              private fun launch() {
                  val ed = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                  checks.forEach { ed.putBoolean(it.tag as String, it.isChecked) }
                  ed.putInt("speed", (speedGroup.checkedRadioButtonId - 100).coerceIn(0, 2))
                  ed.putInt("maxTaps", maxTaps.text.toString().toIntOrNull()?.coerceIn(1, 12) ?: 6)
                  ed.putInt("skipTop", skipTop.text.toString().toIntOrNull()?.coerceIn(0, 90) ?: 8)
                  ed.apply()

                  if (!Settings.canDrawOverlays(this)) { toast("Do step 1 first"); return }
                  if (TapService.instance == null) { toast("Do step 2 first"); return }
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 2)

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), 1)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 1) return
                  if (resultCode != RESULT_OK || data == null) { toast("Screen capture is needed to find balloons"); return }
                  startForegroundService(Intent(this, CaptureService::class.java).putExtra("code", resultCode).putExtra("data", data))
                  toast("Open your game and tap START")
                  moveTaskToBack(true)
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }
          ENDOFFILE
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonTapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
