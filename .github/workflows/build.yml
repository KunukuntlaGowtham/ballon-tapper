                      val pm = getSystemService(android.os.PowerManager::class.java)
                      if (pm.isIgnoringBatteryOptimizations(packageName)) toast("Already allowed")
                      else startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  })
                  root.addView(button("4. Save & launch overlay") { launch() })

                  setContentView(ScrollView(this).apply { addView(root) })
                  if (intent?.getBooleanExtra("resume", false) == true) root.post { launch() }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.getBooleanExtra("resume", false)) launch()
              }

              override fun onResume() {
                  super.onResume()
                  val overlayOk = Settings.canDrawOverlays(this)
                  val tapOk = TapService.instance != null
                  status.text = "Floating button permission: ${if (overlayOk) "OK" else "NO"}\n" +
                          "Tap service: ${if (tapOk) "OK" else "NO"}"
              }

              private fun launch() {
                  val ed = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                  checks.forEach { ed.putBoolean(it.tag as String, it.isChecked) }
                  ed.putBoolean("fx", fxCheck.isChecked)
                  ed.putBoolean("combo", comboCheck.isChecked)
                  ed.putBoolean("coverAll", coverCheck.isChecked)
                  ed.putInt("scale", (qualityGroup.checkedRadioButtonId - 300).coerceIn(3, 8))
                  ed.putInt("gapMs", gapInput.text.toString().toIntOrNull()?.let { if (it <= 0) 0 else it.coerceIn(5, 2000) } ?: 0)
                  ed.putInt("speed", (speedGroup.checkedRadioButtonId - 100).coerceIn(0, 2))
                  ed.putInt("human", (styleGroup.checkedRadioButtonId - 200).coerceIn(0, 3))
                  ed.putInt("maxTaps", maxTaps.text.toString().toIntOrNull()?.coerceIn(1, 30) ?: 6)
                      .putInt("skipTop", skipTop.text.toString().toIntOrNull()?.coerceIn(0, 90) ?: 8)
                      .putInt("fingersHuman", fingersHuman.text.toString().toIntOrNull()?.coerceIn(1, 5) ?: 1)
                      .putInt("fingersMachine", fingersMachine.text.toString().toIntOrNull()?.coerceIn(1, 5) ?: 1)
                      .apply()

                  if (!Settings.canDrawOverlays(this)) { toast("Do step 1 first"); return }
                  if (TapService.instance == null) { toast("Do step 2 first"); return }
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 2)

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), 1)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 1) return
                  if (resultCode != RESULT_OK || data == null) { toast("Screen capture is needed to find balloons"); return }
                  startForegroundService(Intent(this, CaptureService::class.java)
                      .putExtra("code", resultCode).putExtra("data", data))
                  toast("Open your game and tap START")
                  moveTaskToBack(true)
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }
          ENDOFFILE
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonTapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
